<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#F5F3F6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16141B" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="气色簿"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><title>气色簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=ZCOOL+XiaoWei&display=swap" media="print" onload="this.media='all'">
<style>
/* 布局：手账式单列，手机底部文字目录，桌面左侧目录。配色取自传统妆品：铅粉、黛、胭脂。 */
:root {
  --bg: #F5F3F6; --surface: #FFFFFF; --surface-2: #ECE8EF; --line: #DED8E2;
  --ink: #26242E; --ink-2: #575363; --ink-3: #6E6A7B;
  --rouge: #A82A45; --rouge-wash: #F6E3E7; --on-rouge: #FFFFFF;
  --dai: #5468BC; --dai-wash: #E3E6F4;
  --good: #1F6F64; --good-wash: #DCEFEA; --warn: #8F5C0C; --warn-wash: #F6EAD2; --crit: #A8201A; --crit-wash: #F9DEDC;
  --heat-1: #F0CBD3; --heat-2: #D7798C; --heat-3: #A82A45;
  --scrim: rgba(24, 20, 30, 0.46);
  --f-display: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif SC", serif;
  --f-body: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-num: "Jost", "Helvetica Neue", Arial, var(--f-body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141B; --surface: #201D27; --surface-2: #2C2835; --line: #3A3545;
    --ink: #EFECF3; --ink-2: #BBB6C6; --ink-3: #9C97A9;
    --rouge: #DE6381; --rouge-wash: #41222C; --on-rouge: #1B1218;
    --dai: #7186DA; --dai-wash: #2A2F47;
    --good: #72CBBE; --good-wash: #1C3531; --warn: #E3B25E; --warn-wash: #3A2E18; --crit: #F2938C; --crit-wash: #40201E;
    --heat-1: #51303A; --heat-2: #96455A; --heat-3: #DE6381;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141B; --surface: #201D27; --surface-2: #2C2835; --line: #3A3545;
  --ink: #EFECF3; --ink-2: #BBB6C6; --ink-3: #9C97A9;
  --rouge: #DE6381; --rouge-wash: #41222C; --on-rouge: #1B1218;
  --dai: #7186DA; --dai-wash: #2A2F47;
  --good: #72CBBE; --good-wash: #1C3531; --warn: #E3B25E; --warn-wash: #3A2E18; --crit: #F2938C; --crit-wash: #40201E;
  --heat-1: #51303A; --heat-2: #96455A; --heat-3: #DE6381;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; }
h1 { font-size: 27px; line-height: 1.25; }
h2 { font-size: 21px; line-height: 1.3; }
h3 { font-size: 15px; font-weight: 600; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rouge); outline-offset: 2px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.note { color: var(--ink-2); font-size: 14px; max-width: 62ch; }
.num-f { font-family: var(--f-num); }
.tn { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.stack-s { display: grid; gap: 6px; min-width: 0; align-content: start; }

/* 框架 */
.shell { min-height: 100%; }
.main { padding-block: 12px 104px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.brand { font-family: var(--f-display); font-size: 21px; letter-spacing: 0.06em; text-decoration: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tabbar a { position: relative; display: flex; align-items: center; justify-content: center; height: 56px; padding-bottom: 6px; color: var(--ink-3); text-decoration: none; font-size: 14px; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar a[aria-current="page"]::after, .rail nav a[aria-current="page"]::before { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--rouge); }
.tabbar a[aria-current="page"]::after { bottom: 9px; }
.rail { display: none; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 176px minmax(0, 1fr); }
  .rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 28px 12px 24px 32px; border-right: 1px solid var(--line); }
  .rail .brand { font-size: 28px; }
  .rail nav { display: grid; gap: 2px; }
  .rail nav a { position: relative; display: block; padding: 8px 0 8px 16px; text-decoration: none; color: var(--ink-3); font-size: 16px; }
  .rail nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .rail nav a[aria-current="page"]::before { left: 2px; top: 19px; }
  .rail .rail-foot { margin-top: auto; }
  .tabbar, .topbar { display: none; }
  .main { max-width: 1060px; padding-block: 30px 56px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; column-gap: 48px; align-items: start; }
  .cols > .span-2 { grid-column: 1 / -1; }
}
.cols { display: grid; grid-template-columns: minmax(0, 1fr); }
.sec { display: grid; gap: 12px; padding-block: 20px; border-top: 1px solid var(--line); min-width: 0; align-content: start; }
.sec.first { border-top: 0; padding-top: 8px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* 控件 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--rouge); background: var(--rouge); color: var(--on-rouge); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.danger { background: transparent; border-color: var(--crit); color: var(--crit); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; background: transparent; color: var(--ink-2); border-radius: 6px; cursor: pointer; text-decoration: none; flex: none; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--rouge); cursor: pointer; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 8px; background: var(--surface-2); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 5px 12px; min-height: 36px; border-radius: 6px; color: var(--ink-2); font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink-2); font-size: 14px; cursor: pointer; }
.chip.on { border-color: var(--rouge); background: var(--rouge-wash); color: var(--ink); }
.chip em { font-style: normal; font-family: var(--f-num); color: var(--ink-3); font-size: 13px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span, .label { font-size: 13px; color: var(--ink-2); }
.field input, .field select, .field textarea, .plain { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 16px; }
.field textarea { min-height: 76px; resize: vertical; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.err { color: var(--crit); font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding-block: 8px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--rouge); flex: none; }
.num-box { display: inline-flex; align-items: center; gap: 4px; }
.num-box input { width: 74px; min-height: 38px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: center; font-family: var(--f-num); font-size: 16px; }
.num-box em { font-style: normal; font-size: 13px; color: var(--ink-3); }

/* 状态 */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 11px; font-size: 13px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.crit { background: var(--crit-wash); color: var(--crit); }
.pill.info { background: var(--dai-wash); color: var(--ink-2); }
.notice { display: grid; gap: 2px; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: var(--ink); background: var(--dai-wash); }
.notice.warn { background: var(--warn-wash); }
.notice.crit { background: var(--crit-wash); }
.notice.good { background: var(--good-wash); }
.notice b { font-weight: 600; }
.meter { height: 8px; border-radius: 4px; background: var(--rouge-wash); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--rouge); transition: width 0.25s; }
.meter.over i { background: var(--warn); }

/* 今日 */
.day-nav { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 4px; }
.day-nav > div { text-align: center; }
.term { font-size: 13px; color: var(--ink-3); }
@media (min-width: 900px) { .day-nav { grid-template-columns: minmax(0, 1fr) 40px 40px; } .day-nav > div { text-align: left; grid-row: 1; grid-column: 1; } }
.hero-day { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.flower-wrap { position: relative; width: 148px; height: 148px; }
.flower-wrap .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-num); font-weight: 500; font-size: 30px; }
.petal { fill: var(--surface-2); transition: fill 0.25s; }
.petal.on { fill: var(--rouge); }
.thing { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.thing:first-child { border-top: 0; }
.thing .t { font-weight: 600; }
.thing .d { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.tick { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: transparent; padding: 0; cursor: pointer; }
.tick path { fill: var(--surface-2); transition: fill 0.2s; }
.tick.on path { fill: var(--rouge); }
.big-fig { font-family: var(--f-num); font-size: 52px; font-weight: 500; line-height: 1.05; }
.big-fig small { font-size: 18px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 14px 18px; }
.kv > div { display: grid; gap: 1px; min-width: 0; }
.kv .v { font-family: var(--f-num); font-size: 22px; font-weight: 500; line-height: 1.25; }
.kv .v small { font-size: 13px; font-weight: 400; color: var(--ink-3); margin-left: 2px; }
.kv .k { font-size: 13px; color: var(--ink-3); }

/* 饮食 / 列表 */
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .d { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.bar-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .v { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.macro { display: grid; gap: 4px; }
details { border-top: 1px solid var(--line); padding-block: 8px; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 8px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--f-num); color: var(--ink-3); font-size: 18px; }
details[open] summary::after { content: "–"; }

/* 训练 */
.ex { display: grid; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; }
.set-row { display: grid; grid-template-columns: 24px auto auto minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.set-row .idx { font-family: var(--f-num); color: var(--ink-3); text-align: center; }
.done-btn { width: 40px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink-3); cursor: pointer; }
.done-btn.on { background: var(--rouge); border-color: var(--rouge); color: var(--on-rouge); }
.rest { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); z-index: 19; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--bg); }
.rest .t { font-family: var(--f-num); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rest button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px; min-height: 34px; padding: 2px 10px; cursor: pointer; }
@media (min-width: 900px) { .rest { bottom: 0; left: 176px; } }

/* 图表 */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 1px; display: block; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--f-num); font-size: 12px; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.tip { position: absolute; top: 2px; pointer-events: none; padding: 5px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.45; white-space: nowrap; z-index: 2; }
.tip b { font-family: var(--f-num); font-weight: 600; font-size: 15px; }
.empty { display: grid; gap: 4px; place-items: center; text-align: center; padding: 28px 12px; color: var(--ink-3); font-size: 14px; background: var(--surface-2); border-radius: 6px; }
.table-wrap { overflow-x: auto; max-height: 280px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--ink-3); position: sticky; top: 0; background: var(--bg); }
.heat { display: grid; grid-template-columns: 34px minmax(0, 1fr); row-gap: 3px; align-items: center; font-size: 13px; color: var(--ink-2); touch-action: pan-y; }
.heat-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; }
.heat-row i { display: block; height: 16px; border-radius: 2px; background: var(--surface-2); }
.heat-row i.l1 { background: var(--heat-1); }
.heat-row i.l2 { background: var(--heat-2); }
.heat-row i.l3 { background: var(--heat-3); }
.heat-row i.none { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.heat-row i.hit { outline: 2px solid var(--ink); outline-offset: 0; }

/* 护肤 */
.routine { counter-reset: s; display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
.routine li { counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.routine li::before { content: counter(s); font-family: var(--f-num); color: var(--rouge); font-weight: 600; }
.routine li span { font-size: 13px; color: var(--ink-3); display: block; }
.nights { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.nights div { padding: 8px 2px; text-align: center; font-size: 13px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.nights div.on { background: var(--rouge); color: var(--on-rouge); font-weight: 600; }
.scale { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 14px; }
.scale .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.scale .seg button { padding: 4px 2px; font-size: 13px; }

/* 照片 */
.cmp { position: relative; width: 100%; max-width: 420px; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--surface-2); touch-action: pan-y; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cmp .bar { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); pointer-events: none; }
.cmp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp .lb { position: absolute; bottom: 8px; padding: 1px 8px; border-radius: 4px; font-size: 12px; background: var(--scrim); color: #fff; font-family: var(--f-num); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.thumb { position: relative; aspect-ratio: 3 / 4; border: 0; padding: 0; background: var(--surface-2); border-radius: 4px; overflow: hidden; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; background: var(--scrim); color: #fff; font-family: var(--f-num); padding: 1px 4px; }

/* 花历 */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--ink-3); }
.cal button { position: relative; display: grid; justify-items: center; align-content: start; padding: 2px 0; background: transparent; border: 0; cursor: pointer; border-radius: 4px; color: var(--ink-3); }
.cal button.today { background: var(--surface-2); }
.cal button:disabled { cursor: default; opacity: 0.4; }
.cal span { font-size: 11px; font-family: var(--f-num); line-height: 1.2; }
.review-text { white-space: pre-wrap; line-height: 1.75; }
.bubble { padding: 8px 12px; border-radius: 8px; background: var(--surface); max-width: 92%; white-space: pre-wrap; justify-self: start; }
.bubble.me { background: var(--rouge-wash); justify-self: end; }

/* 弹层 */
.sheet-bg { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 12px 12px 0 0; background: var(--bg); padding-block: 14px calc(22px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 900px) { .sheet-bg { align-items: center; } .sheet { border-radius: 10px; padding: 22px 26px; } }
.toasts { position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; justify-items: center; gap: 6px; padding-inline: 16px; pointer-events: none; }
.toast { padding: 7px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: 100%; }
.toast.crit { background: var(--crit); color: var(--surface); }
@media (min-width: 900px) { .toasts { bottom: 28px; } }

/* 首次设置 */
.setup { max-width: 980px; margin-inline: auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
@media (min-width: 900px) { .setup { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 64px; padding-top: 56px; } .setup .aside { position: sticky; top: 40px; align-self: start; } }
.setup .brand-big { font-family: var(--f-display); font-size: 40px; letter-spacing: 0.08em; line-height: 1.1; }
.steps { display: flex; gap: 6px; }
.steps i { height: 3px; flex: 1; border-radius: 2px; background: var(--surface-2); }
.steps i.on { background: var(--rouge); }
.boot { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.boot .inner { display: grid; gap: 10px; justify-items: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

      const prompt = `${RULES}\n\n请根据这一周的数据写复盘，总字数不超过 220 字。严格按三段写，每段开头用这几个小标题，单独成行：\n做得好的\n最该调整的\n下周只盯这一件事\n“最该调整的”最多两条，要具体到动作和数字。不要用 Markdown 符号。\n\n数据：${JSON.stringify(data)}`;
      return sample(prompt, { cache: false, onText, signal });
    },
    chat(turns, context, onText, signal) {
      const lead = { role: 'user', content: `${RULES}\n回答简短，一般不超过 200 字，不要用 Markdown 符号。\n\n这是对方最近的数据，只在相关时引用：${context}` };
      return sample([lead, ...turns.slice(-12)], { cache: false, onText, signal });
    },
  };

  QS.AI = AI;
  QS.Store = { state, subscribe, emit, day, patchDay, setProfile, setMed, setPhotos, setReviews, setFoods, setComp, toast, openSheet, closeSheet, init, uploadPhoto, deletePhoto, photoUrl, exportAll, clearAll, readBackup, restoreBackup };
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
/* 气色簿 · 共用组件和跨页面的小工具。 */
const { html, render, useState, useEffect, useRef } = htmPreact;
const E = QS.E, S = QS.Store, AI = QS.AI;
const UI = { date: E.today(), followToday: true, rest: null };

const n0 = (v) => (v == null ? '—' : Math.round(v).toLocaleString('zh-CN'));
const n1 = (v) => (v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function shiftDate(n) {
  const nd = E.addDays(UI.date, n);
  if (nd > E.today()) return;
  UI.date = nd;
  UI.followToday = nd === E.today();
  S.emit();
}
function goToday() { UI.date = E.today(); UI.followToday = true; S.emit(); }

const ic = (d, s) => html`<svg width=${s || 18} height=${s || 18} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${d}/></svg>`;
const Icon = {
  left: () => ic('M15 5l-7 7 7 7'),
  right: () => ic('M9 5l7 7-7 7'),
  close: () => ic('M6 6l12 12M18 6L6 18'),
  check: () => ic('M5 12.5l4.5 4.5L19 7.5'),
  plus: () => ic('M12 5v14M5 12h14'),
  sliders: () => ic('M4 7h9m4 0h3M4 17h3m4 0h9M15 5v4M9 15v4', 20),
  camera: () => ic('M4 8h3l2-3h6l2 3h3v11H4zM12 11a3 3 0 1 0 0 6a3 3 0 0 0 0-6'),
};

const PETAL_BIG = 'M0 -21C14 -26 17 -41 0 -49C-17 -41 -14 -26 0 -21Z';
const PETAL_SMALL = 'M0 -6C15 -13 18 -37 0 -47C-18 -37 -15 -13 0 -6Z';
function Flower({ states, size, small }) {
  const P = small ? PETAL_SMALL : PETAL_BIG;
  return html`<svg viewBox="0 0 100 100" width=${size} height=${size} aria-hidden="true"><g transform="translate(50 50)">${states.map((on, i) => html`<path class=${'petal' + (on ? ' on' : '')} d=${P} transform=${`rotate(${(360 / 7) * i})`}/>`)}</g></svg>`;
}
function Tick({ on, label, onClick }) {
  return html`<button type="button" class=${'tick' + (on ? ' on' : '')} aria-pressed=${on ? 'true' : 'false'} aria-label=${label} onClick=${onClick}>
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M20 3C32 9 35 25 20 37C5 25 8 9 20 3Z"/>${on ? html`<polyline points="14,20 18.5,24.5 26.5,15.5" fill="none" stroke="var(--on-rouge)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` : null}</svg>
  </button>`;
}

function Sec({ title, note, right, children, first, cls }) {
  return html`<section class=${'sec' + (first ? ' first' : '') + (cls ? ' ' + cls : '')}>
    ${title || right ? html`<div class="sec-h">${title ? html`<h2>${title}</h2>` : html`<span></span>`}${right || null}</div>` : null}
    ${note ? html`<p class="note">${note}</p>` : null}
    ${children}
  </section>`;
}
function Seg({ value, onChange, options, label }) {
  return html`<div class="seg" role="radiogroup" aria-label=${label}>${options.map((o) => html`<button type="button" role="radio" aria-checked=${value === o.v ? 'true' : 'false'} class=${value === o.v ? 'on' : ''} onClick=${() => onChange(o.v)}>${o.l}</button>`)}</div>`;
}
function Chips({ value, onToggle, options }) {
  return html`<div class="chips">${options.map((o) => html`<button type="button" class=${'chip' + (value.includes(o.v) ? ' on' : '')} aria-pressed=${value.includes(o.v) ? 'true' : 'false'} onClick=${() => onToggle(o.v)}>${o.l}</button>`)}</div>`;
}
function Pill({ s, children }) { return html`<span class=${'pill ' + s}>${children}</span>`; }

/* 输入时只改本地文字，离开输入框或按回车时才保存。 */
function Num({ id, value, onCommit, unit, placeholder, label, min, max, width }) {
  const show = value == null ? '' : String(value);
  const [text, setText] = useState(show);
  useEffect(() => { setText(show); }, [show]);
  const commit = () => {
    const t = text.trim();
    if (t === '') { if (value != null) onCommit(null); return; }
    const n = parseFloat(t);
    if (!isFinite(n) || (min != null && n < min) || (max != null && n > max)) {
      S.toast(`请填 ${min} 到 ${max} 之间的数字`, 'crit');
      setText(show);
      return;
    }
    if (n !== value) onCommit(n);
  };
  return html`<span class="num-box"><input id=${id} type="text" inputmode="decimal" autocomplete="off" aria-label=${label} placeholder=${placeholder || ''} value=${text} onInput=${(e) => setText(e.target.value)} onBlur=${commit} onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); }} style=${width ? `width:${width}px` : ''}/>${unit ? html`<em>${unit}</em>` : null}</span>`;
}
function Field({ id, label, value, onInput, placeholder, type, inputmode }) {
  return html`<label class="field"><span>${label}</span><input id=${id} type=${type || 'text'} inputmode=${inputmode} autocomplete="off" placeholder=${placeholder || ''} value=${value} onInput=${(e) => onInput(e.target.value)}/></label>`;
}
function Area({ id, label, value, onInput, placeholder }) {
  return html`<label class="field"><span>${label}</span><textarea id=${id} placeholder=${placeholder || ''} value=${value} onInput=${(e) => onInput(e.target.value)}></textarea></label>`;
}
function Select({ id, label, value, onChange, children }) {
  return html`<label class="field"><span>${label}</span><select id=${id} value=${value} onChange=${(e) => onChange(e.target.value)}>${children}</select></label>`;
}
/* 平台不显示 confirm 弹窗，危险操作用“再点一次”确认。 */
function Confirm({ label, sure, onYes, cls }) {
  const [arm, setArm] = useState(false);
  useEffect(() => { if (!arm) return undefined; const t = setTimeout(() => setArm(false), 4000); return () => clearTimeout(t); }, [arm]);
  return html`<button type="button" class=${cls || 'link'} onClick=${() => { if (arm) { setArm(false); onYes(); } else setArm(true); }}>${arm ? sure || '确定吗？再点一次' : label}</button>`;
}
function Meter({ pct, over }) {
  return html`<div class=${'meter' + (over ? ' over' : '')}><i style=${`width:${E.clamp(pct, 0, 100)}%`}></i></div>`;
}
function Notice({ s, title, children, href }) {
  const body = html`${title ? html`<b>${title}</b>` : null}${children ? html`<span>${children}</span>` : null}`;
  return href ? html`<a class=${'notice ' + (s || '')} href=${href}>${body}</a>` : html`<div class=${'notice ' + (s || '')}>${body}</div>`;
}

function useWidth() {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    const set = () => setW(el.clientWidth);
    set();
    const ro = new ResizeObserver(set);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}
function niceTicks(min, max, n) {
  const span = max - min || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 1000; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

/* 当前日期需要的全部推导结果，各页面共用。 */
function ctxOf(date) {
  const st = S.state, p = st.profile;
  const weight = E.latestWeight(st.days, p.weight);
  const plan = E.plan(p, weight, date);
  const recovery = E.recovery(st.med.items, date);
  const barrier = E.barrierAlert(st.days, date);
  const skin = E.skinPlan(p, date, { recovery, barrier });
  const pgm = E.program(p, date);
  const nextIdx = E.nextSession(pgm, st.days, date);
  return { plan, recovery, barrier, skin, pgm, nextIdx, next: pgm[nextIdx], weight };
}

function remindersFor(date, ctx) {
  const st = S.state, out = [], pl = ctx.plan;
  if (ctx.recovery) {
    const r = ctx.recovery;
    out.push({ s: 'warn', t: `${r.c.n} 术后第 ${r.day} 天 · ${r.phase}`, d: r.pause ? `A 醇和酸类暂停到 ${E.fmtShort(r.resume)}，护肤已切换成修护方案。` : '可以恢复日常护肤，防晒继续做足。', href: '#med' });
  }
  E.dues(st.med.items, date).filter((x) => x.left <= 14).slice(0, 2).forEach((x) => {
    out.push({ s: 'info', t: x.left < 0 ? `${x.c.n} 已过建议复做时间 ${-x.left} 天` : x.left === 0 ? `${x.c.n} 今天到建议复做时间` : `${x.c.n} 还有 ${x.left} 天到建议复做时间`, d: '要不要做由你和医生决定，这里只是提醒。', href: '#med' });
  });
  if (pl.showNumbers) {
    const pc = E.pace(E.weightSeries(st.days), pl);
    if (pc.status === 'fast') out.push({ s: 'crit', t: '体重掉得偏快', d: `最近每周约 ${Math.abs(pc.perWeek).toFixed(1)} kg，超过体重的 1%。适当多吃一点，保住肌肉和气色。`, href: '#body' });
    if (date === E.today()) {
      const started = E.diff(date, st.profile.startDate || date);
      const lastC = st.comp.items.map((x) => x.date).sort().pop();
      if (lastC && E.diff(date, lastC) >= 84) out.push({ s: 'info', t: `上次体测是 ${E.diff(date, lastC)} 天前`, d: '可以复测了。同一台机器、相近时间测，结果才好比较。', href: '#body' });
      const dates = Object.keys(st.days).sort();
      const lastM = dates.filter((d) => st.days[d].measure).pop();
      if (started >= 1 && (!lastM || E.diff(date, lastM) >= 14)) out.push({ s: 'info', t: lastM ? `上次量围度是 ${E.diff(date, lastM)} 天前` : '还没有量过围度', d: '腰围比体重更能反映减脂效果。', href: '#body' });
      const lastP = st.photos.items.map((x) => x.date).sort().pop();
      if (st.caps.photos && started >= 1 && (!lastP || E.diff(date, lastP) >= 28)) out.push({ s: 'info', t: lastP ? `上次拍对比照是 ${E.diff(date, lastP)} 天前` : '拍一组起始照片', d: '同样的光线和角度，以后对比才准。', href: '#body' });
    }
  }
  return out.slice(0, 4);
}

/* 给 Claude 的数据摘要：只放分析需要的字段，不放昵称、机构和医生姓名。 */
function aiContext() {
  const st = S.state, p = st.profile, date = E.today(), ctx = ctxOf(date), pl = ctx.plan;
  const rows = [];
  for (let i = 13; i >= 0; i--) {
    const k = E.addDays(date, -i), d = st.days[k];
    if (!d) continue;
    const t = E.foodTotals(d);
    rows.push({ date: k, weight: pl.showNumbers ? d.weight : undefined, sleep: d.sleep, water: d.water, steps: d.steps, cardio: d.cardio, kcal: t.n && pl.showNumbers ? t.kcal : undefined, protein: t.n && pl.showNumbers ? t.p : undefined, workout: d.workout && d.workout.doneAt ? QS.SESS[d.workout.key].name : undefined, done: E.things(d, pl, p).filter((x) => x.done).length, skin: d.skin, flags: d.flags, period: d.period || undefined });
  }
  return JSON.stringify({
    profile: { sex: p.sex, age: parseInt(date, 10) - p.birthYear, height: p.height, goals: p.goals, concerns: p.concerns, skinType: p.skinType, trainDays: p.trainDays, level: p.level, safety: p.safety },
    plan: { phase: pl.modeName, kcal: pl.showNumbers ? pl.kcal : undefined, protein: pl.showNumbers ? pl.protein : undefined, goalWeight: pl.showNumbers ? pl.goal : undefined, bmi: pl.showNumbers ? Math.round(pl.bmi * 10) / 10 : undefined },
    pace: pl.showNumbers ? E.pace(E.weightSeries(st.days), pl, E.bodyImproving(st.days, st.comp.items, date)) : undefined,
    composition: pl.showNumbers ? st.comp.items.slice(-2).map((x) => ({ date: x.date, weight: x.weight, bodyFatPct: x.pbf, fatKg: x.fat, skeletalMuscleKg: x.smm, visceralLevel: x.visceral, waistHip: x.whr, segmentalLeanPct: x.lean })) : undefined,
    skinStage: ctx.skin.stageName,
    recovery: ctx.recovery ? { project: ctx.recovery.c.n, day: ctx.recovery.day, phase: ctx.recovery.phase } : undefined,
    aesthetics: st.med.items.slice(-5).map((x) => ({ project: E.medInfo(x).n, date: x.date })),
    days: rows,
  });
}

<script>
/* 气色簿 · 今日、饮食、训练。 */

function DateBar() {
  const date = UI.date, isToday = date === E.today();
  return html`<div class="row between">
    <div class="row" style="gap:2px">
      <button type="button" class="icon-btn" aria-label="前一天" onClick=${() => shiftDate(-1)}>${Icon.left()}</button>
      <strong class="tn">${E.fmtDate(date)}</strong>
      <button type="button" class="icon-btn" aria-label="后一天" disabled=${isToday} onClick=${() => shiftDate(1)}>${Icon.right()}</button>
    </div>
    ${isToday ? null : html`<button type="button" class="link" onClick=${goToday}>回到今天</button>`}
  </div>`;
}

function Today() {
  const date = UI.date, isToday = date === E.today();
  const st = S.state, p = st.profile, d = S.day(date), ctx = ctxOf(date), pl = ctx.plan;
  const th = E.things(d, pl, p);
  const done = th.filter((x) => x.done).length;
  const left = th.filter((x) => !x.done).map((x) => QS.THINGS[x.k].n);
  const term = E.solarTerm(date);
  const rem = remindersFor(date, ctx);
  const t = E.foodTotals(d);
  const palm = p.foodMode === 'palm' || !pl.showNumbers;
  const weekN = Math.max(1, Math.floor(E.diff(date, p.startDate) / 7) + 1);
  const ws = E.weekStart(date);
  let blooms = 0;
  for (let i = 0; i < 7; i++) {
    const dd = st.days[E.addDays(ws, i)];
    if (dd && E.things(dd, pl, p).filter((x) => x.done).length >= 5) blooms++;
  }
  const flip = (k) => { const item = th.find((x) => x.k === k); S.patchDay(date, { t: { ...(d.t || {}), [k]: !item.done } }); };
  const addWater = (ml) => S.patchDay(date, { water: Math.max(0, (d.water || 0) + ml) });
  const series = E.weightSeries(st.days);
  const avg = series.length ? series[series.length - 1].avg : null;
  const yest = st.days[E.addDays(date, -1)];
  const workoutDone = d.workout && d.workout.doneAt;

  const rows = {
    sleep: { d: d.sleep != null ? `昨晚 ${d.sleep} 小时，目标 ${pl.sleep} 小时以上` : `目标 ${pl.sleep} 小时以上`, c: html`<${Num} id="in-sleep" label="睡眠小时" value=${d.sleep ?? null} unit="小时" min=${0} max=${16} width=${56} onCommit=${(v) => S.patchDay(date, { sleep: v })}/>` },
    water: { d: `${n0(d.water || 0)} / ${n0(pl.water)} ml`, c: html`<div class="row" style="gap:4px;flex-wrap:nowrap"><button type="button" class="btn ghost sm" onClick=${() => addWater(250)}>+250</button><button type="button" class="btn ghost sm" onClick=${() => addWater(500)}>+500</button><button type="button" class="icon-btn" style="width:28px" aria-label="减少 250 毫升" onClick=${() => addWater(-250)}>−</button></div>` },
    food: { d: palm ? `手掌法 ${d.palm || 0} / 3 餐` : `${n0(t.kcal)} / ${n0(pl.kcal)} 千卡 · 蛋白 ${n0(t.p)} / ${pl.protein} g`, c: html`<a class="btn ghost sm" href="#food">记录</a>` },
    move: { d: workoutDone ? `已完成 ${QS.SESS[d.workout.key].name}` : `下一节 ${ctx.next.name}，或走够 ${n0(pl.steps)} 步`, c: html`<div class="row" style="gap:6px;flex-wrap:nowrap"><${Num} id="in-steps" label="今日步数" value=${d.steps ?? null} placeholder="步数" min=${0} max=${100000} width=${72} onCommit=${(v) => S.patchDay(date, { steps: v })}/><a class="btn ghost sm" href="#train">训练</a></div>` },
    posture: { d: '10 分钟，改善圆肩和头前伸', c: html`<a class="btn ghost sm" href="#train-posture">看动作</a>` },
    am: { d: ctx.skin.am.map((x) => x.t).join(' → '), c: null },
    pm: { d: `今晚 ${ctx.skin.night.n}`, c: html`<a class="btn ghost sm" href="#skin">方案</a>` },
  };

  return html`
    <header class="stack-s" style="padding-block:2px 6px">
      <div class="day-nav">
        <button type="button" class="icon-btn" aria-label="前一天" onClick=${() => shiftDate(-1)}>${Icon.left()}</button>
        <div><h1>${E.fmtDate(date)}</h1><p class="term">${term.name}第 ${term.day} 天${isToday ? '' : ' · 正在补记这一天'}</p></div>
        <button type="button" class="icon-btn" aria-label="后一天" disabled=${isToday} onClick=${() => shiftDate(1)}>${Icon.right()}</button>
      </div>
    </header>
    <div class="cols">
      <div>
        <${Sec} first=${true}>
          <div class="hero-day">
            <div class="flower-wrap"><${Flower} states=${th.map((x) => x.done)} size=${148}/><div class="count" aria-label=${`完成 ${done} 件，共 7 件`}>${done}/7</div></div>
            <div class="stack-s">
              <h2>${done === 7 ? '七件事都做到了' : done === 0 ? '从最容易的一件开始' : `今天做到了 ${done} 件`}</h2>
              <p class="note">${done === 7 ? '好好休息，明天继续。' : `还差：${left.join('、')}`}</p>
              <p class="small muted">本周 ${blooms} 天开花（做到 5 件以上）</p>
            </div>
          </div>
          ${rem.length ? html`<div class="stack-s">${rem.map((r) => html`<${Notice} s=${r.s} title=${r.t} href=${r.href}>${r.d}<//>`)}</div>` : null}
        <//>
        <${Sec} title="今日七件事" right=${isToday ? null : html`<button type="button" class="link" onClick=${goToday}>回到今天</button>`}>
          <div>
            ${QS.THING_KEYS.map((k) => {
              const item = th.find((x) => x.k === k);
              return html`<div class="thing"><${Tick} on=${item.done} label=${`${QS.THINGS[k].n}：${item.done ? '已完成，点击取消' : '点击标记完成'}`} onClick=${() => flip(k)}/>
                <div><div class="t">${QS.THINGS[k].n}</div><div class="d">${rows[k].d}</div></div>

              </div>`;
            })}
          </div>
          ${p.sex === 'f' && p.trackCycle ? html`<div class="chips"><button type="button" class=${'chip' + (d.period ? ' on' : '')} aria-pressed=${d.period ? 'true' : 'false'} onClick=${() => S.patchDay(date, { period: !d.period })}>今天在经期</button></div>` : null}
        <//>
      </div>
      <div>
        ${pl.showNumbers ? html`<${Sec} title="今晨体重" note="空腹、上完厕所后称最准。单日波动主要是水分，看 7 日均值。">
          <div class="row between">
            <${Num} id="in-weight" label="今晨体重" value=${d.weight ?? null} unit="kg" min=${25} max=${300} placeholder="—" width=${88} onCommit=${(v) => S.patchDay(date, { weight: v })}/>
            <div class="small muted tn">${yest && yest.weight != null ? `昨天 ${n1(yest.weight)} · ` : ''}7 日均值 ${n1(avg)} kg</div>
          </div>
        <//>` : null}
        <${Sec} title="当前计划" right=${html`<${Pill} s="info">${pl.modeName} · 第 ${weekN} 周<//>`}>
          <div class="kv">
            ${pl.showNumbers ? html`<div><span class="v">${n0(pl.kcal)}<small>千卡</small></span><span class="k">每日热量</span></div>
            <div><span class="v">${pl.protein}<small>g</small></span><span class="k">蛋白质</span></div>` : null}
            <div><span class="v">${n0(pl.water)}<small>ml</small></span><span class="k">饮水</span></div>
            <div><span class="v">${n0(pl.steps)}<small>步</small></span><span class="k">步数</span></div>
          </div>
          ${pl.warnings.map((w) => html`<${Notice} s=${w.s}>${w.t}<//>`)}
          <p class="small muted">${term.tip}</p>
        <//>
      </div>
    </div>`;
}

// ---------- 饮食 ----------
const SLOTS = ['早餐', '午餐', '晚餐', '加餐'];
function defaultSlot() { const h = new Date().getHours(); return h < 10 ? '早餐' : h < 15 ? '午餐' : h < 21 ? '晚餐' : '加餐'; }
const FLAG_OPTS = [{ v: 'salt', l: '高盐重口' }, { v: 'sugar', l: '奶茶甜食' }, { v: 'alcohol', l: '喝酒' }, { v: 'snack', l: '夜宵' }];

function MacroBar({ label, val, target, unit }) {
  return html`<div class="macro"><div class="row between small"><span>${label}</span><span class="tn">${n0(val)} / ${n0(target)} ${unit}</span></div><${Meter} pct=${(val / target) * 100} over=${val > target * 1.1}/></div>`;
}

function rememberFood(f) {
  const items = [...S.state.foods.items];
  const i = items.findIndex((x) => x.name === f.name);
  if (i >= 0) items[i] = { ...items[i], n: (items[i].n || 1) + 1 };
  else items.push({ ...f, n: 1 });
  S.setFoods({ items: items.sort((a, b) => b.n - a.n).slice(0, 40) });
}

function MealAdd({ onAdd, slot, setSlot }) {
  const caps = S.state.caps;
  const [text, setText] = useState('');
  const [img, setImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  const [err, setErr] = useState('');
  const [manual, setManual] = useState(false);
  const [m, setM] = useState({ name: '', kcal: '', p: '', c: '', f: '' });
  const showManual = manual || !caps.ai;

  const run = async () => {
    if (!text.trim() && !img) { setErr('先写下吃了什么，或者选一张照片。'); return; }
    setBusy(true); setErr(''); setRes(null);
    try { setRes(await AI.estimateMeal(text.trim(), img)); }
    catch (e) { setErr(AI.errorText(e)); }
    setBusy(false);
  };
  const saveRes = () => {
    const sum = (key) => res.items.reduce((s, x) => s + x[key], 0);
    onAdd({ slot, name: res.items.map((x) => x.name).join('、'), kcal: sum('kcal'), p: sum('p'), c: sum('c'), f: sum('f'), est: true });
    setRes(null); setText(''); setImg(null);
  };
  const saveManual = () => {
    if (!m.name.trim() || !(+m.kcal >= 0) || m.kcal === '') { setErr('至少要填名称和热量。'); return; }
    onAdd({ slot, name: m.name.trim(), kcal: Math.round(+m.kcal), p: Math.round(+m.p || 0), c: Math.round(+m.c || 0), f: Math.round(+m.f || 0) });
    rememberFood({ name: m.name.trim(), unit: '自己添加', kcal: Math.round(+m.kcal), p: Math.round(+m.p || 0), c: Math.round(+m.c || 0), f: Math.round(+m.f || 0) });
    setM({ name: '', kcal: '', p: '', c: '', f: '' }); setErr('');
  };
  const setField = (k) => (v) => setM({ ...m, [k]: v });

  return html`<div class="stack">
    <${Seg} label="餐次" value=${slot} onChange=${setSlot} options=${SLOTS.map((s) => ({ v: s, l: s }))}/>
    ${caps.ai ? html`<div class="stack">
      <${Area} id="meal-text" label="吃了什么" value=${text} onInput=${setText} placeholder="比如：一碗牛肉面，一个卤蛋，半杯无糖豆浆"/>
      <div class="row">
        <button type="button" class="btn" disabled=${busy} onClick=${run}>${busy ? 'Claude 正在估算…' : '让 Claude 估算'}</button>
        ${caps.images ? html`<label class="btn ghost">${Icon.camera()}${img ? '换一张' : '拍照估算'}<input id="meal-photo" type="file" accept="image/*" hidden onChange=${(e) => setImg(e.target.files[0] || null)}/></label>` : null}
        <button type="button" class="link" onClick=${() => setManual(!manual)}>${manual ? '收起手动填写' : '手动填写'}</button>
      </div>
      ${img ? html`<p class="small muted">已选一张照片。<button type="button" class="link" onClick=${() => setImg(null)}>移除</button></p>` : null}
    </div>` : html`<p class="note">${window.QS_OFFLINE ? '离线版没有 Claude 估算，直接手动填写。' : '用 claude.ai 账号打开这个页面后，可以直接写一句话或拍照估算。现在先手动填写。'}</p>`}
    ${err ? html`<p class="err">${err}</p>` : null}
    ${res ? html`<div class="stack-s">
      <div class="list">${res.items.map((x) => html`<div class="li"><div><div>${x.name}</div><div class="d">${x.amount}</div></div><div class="small tn">${x.kcal} 千卡 · 蛋白 ${x.p} g</div></div>`)}</div>
      ${res.note ? html`<p class="small muted">${res.note}</p>` : null}
      <div class="row"><button type="button" class="btn" onClick=${saveRes}>记下这一餐</button><button type="button" class="btn ghost" onClick=${() => setRes(null)}>不要了</button></div>
    </div>` : null}
    ${showManual ? html`<div class="stack">
      <${Field} id="m-name" label="名称" value=${m.name} onInput=${setField('name')} placeholder="比如：公司食堂午餐"/>
      <div class="grid-2">
        <${Field} id="m-kcal" label="热量（千卡）" inputmode="numeric" value=${m.kcal} onInput=${setField('kcal')}/>
        <${Field} id="m-p" label="蛋白质（g）" inputmode="numeric" value=${m.p} onInput=${setField('p')}/>
        <${Field} id="m-c" label="碳水（g，可不填）" inputmode="numeric" value=${m.c} onInput=${setField('c')}/>
        <${Field} id="m-f" label="脂肪（g，可不填）" inputmode="numeric" value=${m.f} onInput=${setField('f')}/>
      </div>
      <div><button type="button" class="btn" onClick=${saveManual}>添加</button></div>
    </div>` : null}
  </div>`;
}

function QuickFoods({ onPick, slot }) {
  const [q, setQ] = useState('');
  const recent = S.state.foods.items;
  const seen = new Set(recent.map((x) => x.name));
  const base = QS.FOODS.filter((x) => !seen.has(x[0])).map(([name, unit, kcal, p, c, f]) => ({ name, unit, kcal, p, c, f }));
  const all = [...recent, ...base];
  const list = q.trim() ? all.filter((x) => x.name.includes(q.trim())) : all.slice(0, 14);
  return html`<div class="stack">
    <label class="field"><span>搜常见食物</span><input id="food-q" type="text" autocomplete="off" value=${q} placeholder="比如：豆浆、奶茶、米饭" onInput=${(e) => setQ(e.target.value)}/></label>
    <div class="chips">${list.map((f) => html`<button type="button" class="chip" title=${f.unit} onClick=${() => onPick(f)}>${f.name} <em>${f.kcal}</em></button>`)}${list.length ? null : html`<span class="small muted">没找到，用上面的方式记录。</span>`}</div>
    <p class="small muted">点一下直接记入${slot}，数字是千卡。份量：${list.slice(0, 3).map((f) => `${f.name} ${f.unit}`).join('；')}。</p>
  </div>`;
}

function Food() {
  const date = UI.date, st = S.state, p = st.profile, d = S.day(date), ctx = ctxOf(date), pl = ctx.plan;

          <div class="row">
            ${[1, 2, 3].map((n) => html`<button type="button" class=${'chip' + ((d.palm || 0) >= n ? ' on' : '')} onClick=${() => S.patchDay(date, { palm: (d.palm || 0) === n ? n - 1 : n })}>第 ${n} 餐吃好了</button>`)}
          </div>
        <//>` : html`<${Sec} first=${true}>
          <div class="stack-s">
            <span class="label">${leftKcal >= 0 ? '今天还可以吃' : '今天多吃了'}</span>
            <div class="big-fig">${n0(Math.abs(leftKcal))}<small>千卡</small></div>
            ${leftKcal < 0 ? html`<p class="note">多吃一天影响很小，明天照常吃，不用靠少吃补回来。</p>` : null}
          </div>
          <div class="stack-s">
            <${MacroBar} label="热量" val=${t.kcal} target=${pl.kcal} unit="千卡"/>

        <//>`}
        ${palm ? null : html`<${Sec} title="今天吃的">
          ${meals.length ? html`<div class="list">${SLOTS.flatMap((sl) => meals.filter((m) => m.slot === sl).map((m) => html`<div class="li" key=${m.id}><div><div>${m.name}</div><div class="d tn">${sl} · ${m.kcal} 千卡 · 蛋白 ${m.p} g${m.est ? ' · 估算' : ''}</div></div><button type="button" class="icon-btn" aria-label=${`删除 ${m.name}`} onClick=${() => rm(m.id)}>${Icon.close()}</button></div>`))}</div>` : html`<div class="empty"><span>还没有记录</span><span class="small">在下面写一句话，或点常见食物，这里会列出今天吃的。</span></div>`}

          <${Chips} value=${FLAG_OPTS.filter((o) => flags[o.v]).map((o) => o.v)} options=${FLAG_OPTS} onToggle=${(k) => S.patchDay(date, { flags: { ...flags, [k]: !flags[k] } })}/>

          <div>

          </div>
        <//>
      </div>
    </div>`;
}

// ---------- 训练 ----------
function useWakeLock(active) {
  useEffect(() => {
    if (!active || !navigator.wakeLock) return undefined;
    let lock = null, dead = false;
    navigator.wakeLock.request('screen').then((l) => { if (dead) l.release(); else lock = l; }).catch(() => {});
    return () => { dead = true; if (lock) lock.release().catch(() => {}); };
  }, [active]);
}

function RestBar() {
  const [, tick] = useState(0);
  const r = UI.rest;
  useEffect(() => {
    if (!r) return undefined;
    const t = setInterval(() => {
      if (UI.rest && Date.now() >= UI.rest.end) { UI.rest = null; S.emit(); clearInterval(t); }
      else tick((v) => v + 1);
    }, 500);
    return () => clearInterval(t);
  }, [r && r.end]);
  if (!r) return null;
  const left = Math.max(0, Math.ceil((r.end - Date.now()) / 1000));
  return html`<div class="rest" role="timer" aria-label="组间休息"><div><span class="small">组间休息</span> <span class="t">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span></div>
    <div class="row" style="flex-wrap:nowrap"><button type="button" onClick=${() => { UI.rest = { ...r, end: r.end + 30000 }; S.emit(); }}>+30 秒</button><button type="button" onClick=${() => { UI.rest = null; S.emit(); }}>跳过</button></div></div>`;
}

function ExerciseCard({ item, venue, date }) {
  const ex = QS.EX[item.ex];
  const variant = ex[venue];
  const unit = ex.unit;
  const last = E.lastPerf(S.state.days, item.ex, venue, date);
  const hint = unit ? null : E.progressHint(last, item.lo, item.hi);
  const w = S.day(date).workout;
  const sets = (w.sets && w.sets[item.ex]) || [];
  const lastSet = (i) => (last ? last.sets[Math.min(i, last.sets.length - 1)] : null);
  const patchSet = (i, patch) => {
    const cur = S.day(date).workout;
    const arr = Array.from({ length: item.sets }, (_, j) => ((cur.sets && cur.sets[item.ex]) || [])[j] || {});
    arr[i] = { ...arr[i], ...patch };
    S.patchDay(date, { workout: { ...cur, sets: { ...(cur.sets || {}), [item.ex]: arr } } });
  };
  const finishSet = (i) => {
    const s = sets[i] || {}, l = lastSet(i);
    if (s.ok) { patchSet(i, { ok: false }); return; }
    patchSet(i, { ok: true, kg: s.kg != null ? s.kg : l && l.kg != null ? l.kg : null, reps: s.reps != null ? s.reps : l && l.reps != null ? l.reps : item.lo });
    UI.rest = { end: Date.now() + ex.rest * 1000 };
    S.emit();
  };
  const repUnit = unit === 'sec' ? '秒' : '次';
  return html`<div class="ex">
    <div class="row between" style="align-items:baseline">
      <h3>${variant}</h3>
      <span class="small muted tn">${item.sets} 组 × ${item.lo}–${item.hi} ${repUnit}</span>
    </div>
    <p class="small muted">${ex.cue} <a href=${'https://search.bilibili.com/all?keyword=' + encodeURIComponent(variant.split('（')[0] + ' 动作教学')} target="_blank" rel="noopener">看演示</a></p>
    ${last && !unit ? html`<p class="small tn">上次 ${last.sets.map((s) => `${s.kg != null ? s.kg + ' kg × ' : ''}${s.reps}`).join('，')}${hint ? html`<span class="muted"> · ${hint.t}</span>` : null}</p>` : null}
    <div class="stack-s">
      ${Array.from({ length: item.sets }, (_, i) => {
        const s = sets[i] || {}, l = lastSet(i);
        return html`<div class="set-row">
          <span class="idx">${i + 1}</span>
          ${unit ? html`<span></span>` : html`<${Num} id=${`s-${item.ex}-${i}-kg`} label=${`第 ${i + 1} 组重量`} value=${s.kg ?? null} unit="kg" min=${0} max=${500} width=${64} placeholder=${l && l.kg != null ? String(l.kg) : ''} onCommit=${(v) => patchSet(i, { kg: v })}/>`}
          <${Num} id=${`s-${item.ex}-${i}-r`} label=${`第 ${i + 1} 组${repUnit}数`} value=${s.reps ?? null} unit=${repUnit} min=${0} max=${600} width=${56} placeholder=${l && l.reps != null ? String(l.reps) : String(item.lo)} onCommit=${(v) => patchSet(i, { reps: v })}/>
          <span></span>
          <button type="button" class=${'done-btn' + (s.ok ? ' on' : '')} aria-pressed=${s.ok ? 'true' : 'false'} aria-label=${`完成第 ${i + 1} 组`} onClick=${() => finishSet(i)}>${Icon.check()}</button>
        </div>`;
      })}
    </div>
  </div>`;
}

function Train() {
  const date = UI.date, st = S.state, p = st.profile, d = S.day(date), ctx = ctxOf(date);

  const [pick, setPick] = useState(null);

  const idx = w ? Math.max(0, pgm.findIndex((s) => s.key === w.key)) : pick != null ? pick : ctx.nextIdx;
  const sess = pgm[idx];
  const active = !!(w && !w.doneAt);
  useWakeLock(active);
  const weekDone = E.weekWorkouts(st.days, date);
  const v = w ? w.venue : venue;
  const totalOk = w && w.sets ? Object.values(w.sets).reduce((a, arr) => a + arr.filter((s) => s.ok).length, 0) : 0;

  const postureRef = useRef(null);
  useEffect(() => {
    if (location.hash === '#train-posture' && postureRef.current) postureRef.current.scrollIntoView();
  }, []);

  return html`
    <header class="stack-s"><h1>训练</h1><${DateBar}/></header>
    <div class="cols">
      <div class="span-2">
        <${Sec} first=${true} title=${active ? `正在练：${sess.name}` : w ? `练完了：${sess.name}` : `下一节：${sess.name}`} right=${html`<${Pill} s=${weekDone >= p.trainDays ? 'good' : 'info'}>本周 ${weekDone} / ${p.trainDays} 次<//>`}>

            <p class="note">${sess.focus}。按顺序循环，漏了一天接着练下一节，不用补。${p.level === 'new' ? '前两周每个动作先做 2 组，学会发力比重量更重要。' : ''}</p>

            <div class="row">
              <${Seg} label="训练场地" value=${venue} onChange=${setVenue} options=${[{ v: 'gym', l: '健身房' }, { v: 'home', l: '在家' }]}/>
              <button type="button" class="btn" onClick=${start}>开始训练</button>

        <//>
        ${w && active ? html`<div>${sess.items.map((it) => html`<${ExerciseCard} key=${it.ex} item=${it} venue=${v} date=${date}/>`)}
