            <label class="row"><span class="small">步数</span><${Num} id="t-steps" label="今日步数" value=${d.steps ?? null} min=${0} max=${100000} width=${88} onCommit=${(val) => S.patchDay(date, { steps: val })}/></label>
            <label class="row"><span class="small">有氧</span><${Num} id="t-cardio" label="有氧分钟" value=${d.cardio ?? null} unit="分钟" min=${0} max=${600} width=${64} onCommit=${(val) => S.patchDay(date, { cardio: val })}/></label>
          </div>
        <//>
        <${Sec} title="最近训练">
          ${history.length ? html`<div class="list">${history.map((k) => { const h = st.days[k].workout; const n = Object.values(h.sets || {}).reduce((a, arr) => a + arr.filter((s) => s.ok).length, 0); return html`<div class="li"><div>${QS.SESS[h.key].name}<div class="d">${E.fmtShort(k)} · ${h.venue === 'gym' ? '健身房' : '在家'}</div></div><div class="small muted tn">${n} 组</div></div>`; })}</div>` : html`<div class="empty"><span>还没有训练记录</span><span class="small">完成第一节后，这里会列出最近的训练。</span></div>`}
        <//>
      </div>
    </div>
    <${RestBar}/>`;
}

</script>
<script>
/* 气色簿 · 身材：体重趋势、围度、对比照片。 */

function WeightChart({ series, goal }) {
  const [ref, width] = useWidth();
  const [hi, setHi] = useState(null);
  let chart = null;
  if (series.length < 2) {
    chart = html`<div class="empty"><span>记录两天体重后，这里会出现趋势线</span><span class="small">到今日页填今晨体重。</span></div>`;
  } else if (width > 0) {
    const W = width, H = W < 600 ? 230 : 290;
    const m = { l: 42, r: 44, t: 14, b: 26 };
    const first = series[0].date, last = series[series.length - 1].date, span = Math.max(1, E.diff(last, first));
    const vals = series.flatMap((s) => [s.w, s.avg]);
    let lo = Math.min(...vals), top = Math.max(...vals);
    const showGoal = goal != null && goal >= lo - 3 && goal <= top + 3;
    if (showGoal) { lo = Math.min(lo, goal); top = Math.max(top, goal); }
    const ticks = niceTicks(lo - 0.1, top + 0.1, 4);
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = (d) => m.l + (E.diff(d, first) / span) * (W - m.l - m.r);
    const Y = (v) => m.t + ((y1 - v) / (y1 - y0)) * (H - m.t - m.b);
    const path = (k) => series.map((s, i) => `${i ? 'L' : 'M'}${X(s.date).toFixed(1)} ${Y(s[k]).toFixed(1)}`).join('');
    const nX = Math.min(span, W < 500 ? 3 : 5);
    const xTicks = Array.from(new Set(Array.from({ length: nX + 1 }, (_, i) => E.addDays(first, Math.round((span * i) / nX)))));
    const end = series[series.length - 1];
    const cur = hi != null && series[hi] ? series[hi] : null;
    const pick = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - r.left;
      let best = 0, bd = Infinity;
      series.forEach((s, i) => { const dd = Math.abs(X(s.date) - x); if (dd < bd) { bd = dd; best = i; } });
      setHi(best);
    };
    const onKey = (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const base = hi == null ? series.length - 1 : hi;
      setHi(E.clamp(base + (e.key === 'ArrowLeft' ? -1 : 1), 0, series.length - 1));
    };
    chart = html`<div class="chart" tabindex="0" role="img" aria-label=${`体重趋势，最新 7 日均值 ${n1(end.avg)} 公斤`} onKeyDown=${onKey} onFocus=${() => setHi(series.length - 1)} onBlur=${() => setHi(null)}>
      <svg viewBox=${`0 0 ${W} ${H}`} onPointerMove=${pick} onPointerDown=${pick} onPointerLeave=${() => setHi(null)}>
        ${ticks.map((v) => html`<g><line class="grid-line" x1=${m.l} x2=${W - m.r} y1=${Y(v)} y2=${Y(v)}/><text x=${m.l - 8} y=${Y(v) + 4} text-anchor="end">${v}</text></g>`)}
        ${xTicks.map((d, i) => html`<text x=${X(d)} y=${H - 6} text-anchor=${i === 0 ? 'start' : i === xTicks.length - 1 ? 'end' : 'middle'}>${E.fmtShort(d)}</text>`)}
        ${showGoal ? html`<g><line x1=${m.l} x2=${W - m.r} y1=${Y(goal)} y2=${Y(goal)} stroke="var(--good)" stroke-width="1"/><text x=${m.l + 4} y=${Y(goal) - 5}>目标 ${n1(goal)}</text></g>` : null}
        <path d=${path('w')} fill="none" stroke="var(--dai)" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d=${path('avg')} fill="none" stroke="var(--rouge)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx=${X(end.date)} cy=${Y(end.avg)} r="4.5" fill="var(--rouge)" stroke="var(--surface)" stroke-width="2"/>
        <text x=${X(end.date) + 10} y=${Y(end.avg) + 4}>${n1(end.avg)}</text>
        ${cur ? html`<g><line class="grid-line" x1=${X(cur.date)} x2=${X(cur.date)} y1=${m.t} y2=${H - m.b}/><circle cx=${X(cur.date)} cy=${Y(cur.avg)} r="4.5" fill="var(--rouge)" stroke="var(--surface)" stroke-width="2"/><circle cx=${X(cur.date)} cy=${Y(cur.w)} r="4" fill="var(--dai)" stroke="var(--surface)" stroke-width="2"/></g>` : null}
      </svg>
      ${cur ? html`<div class="tip" style=${`left:${E.clamp(X(cur.date) - 62, 0, W - 136)}px`}><span class="small">${E.fmtShort(cur.date)}</span><br/><b>${n1(cur.avg)}</b> 7 日均值<br/><b>${n1(cur.w)}</b> 当天</div>` : null}
    </div>`;
  }
  return html`<div ref=${ref} class="stack-s">
    ${series.length >= 2 ? html`<div class="legend"><span><i style="background:var(--rouge)"></i>7 日均值</span><span><i style="background:var(--dai);opacity:.55"></i>每日体重</span></div>` : null}
    ${chart}
  </div>`;
}

const MEAS = [['waist', '腰围'], ['hip', '臀围'], ['chest', '胸围'], ['thigh', '大腿'], ['arm', '上臂'], ['calf', '小腿']];
function measureSeries(days, key) {
  return Object.keys(days).sort().filter((d) => days[d].measure && days[d].measure[key] != null).map((d) => ({ date: d, v: days[d].measure[key] }));
}
function Spark({ vals }) {
  if (vals.length < 2) return html`<span class="small muted">—</span>`;
  const W = 84, H = 26, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const X = (i) => 3 + (i / (vals.length - 1)) * (W - 10), Y = (v) => 4 + ((hi - v) / span) * (H - 8);
  return html`<svg width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} aria-hidden="true"><path d=${vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('')} fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx=${X(vals.length - 1)} cy=${Y(vals[vals.length - 1])} r="3.5" fill="var(--rouge)"/></svg>`;
}
function MeasureForm({ date }) {
  const cur = S.day(date).measure || {};
  const [f, setF] = useState(() => Object.fromEntries(MEAS.map(([k]) => [k, cur[k] != null ? String(cur[k]) : ''])));
  const save = () => {
    const out = {};
    for (const [k, n] of MEAS) {
      if (f[k].trim() === '') continue;
      const v = parseFloat(f[k]);
      if (!isFinite(v) || v < 10 || v > 250) { S.toast(`${n} 请填 10 到 250 之间的数字`, 'crit'); return; }
      out[k] = v;
    }
    S.patchDay(date, { measure: Object.keys(out).length ? out : null });
    S.closeSheet();
    S.toast('围度已保存');
  };
  return html`<div class="stack">
    <p class="note">软尺贴皮肤不勒紧，早上空腹量，每次位置一致。腰围在肚脐上方最细处。不想量的可以留空。</p>
    <div class="grid-2">${MEAS.map(([k, n]) => html`<${Field} id=${'m-' + k} label=${n + '（cm）'} inputmode="decimal" value=${f[k]} onInput=${(v) => setF({ ...f, [k]: v })}/>`)}</div>
    <div><button type="button" class="btn" onClick=${save}>保存</button></div>
  </div>`;
}

const PHOTO_KINDS = [{ v: 'face', l: '正脸' }, { v: 'faceSide', l: '侧脸' }, { v: 'front', l: '身体正面' }, { v: 'side', l: '身体侧面' }, { v: 'back', l: '背面' }];

function PhotoView({ item }) {
  return html`<div class="stack">
    <img src=${S.photoUrl(item.id)} alt=${`${item.date} 的对比照`} style="width:100%;border-radius:6px"/>
    <div class="row between"><span class="small muted tn">${item.date}</span><${Confirm} label="删除这张" sure="永久删除？再点一次" onYes=${async () => { S.closeSheet(); await S.deletePhoto(item.id); S.toast('已删除'); }}/></div>
  </div>`;
}

function Photos() {
  const st = S.state;
  const [kind, setKind] = useState('face');
  const [busy, setBusy] = useState(false);
  const [pos, setPos] = useState(50);
  const [aId, setA] = useState(null);
  const [bId, setB] = useState(null);
  const list = st.photos.items.filter((x) => x.kind === kind).sort((x, y) => (x.date < y.date ? -1 : 1));
  const a = list.find((x) => x.id === aId) || list[0];
  const b = list.find((x) => x.id === bId) || list[list.length - 1];
  const onFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setBusy(true);
    try { await S.uploadPhoto(file, { kind, date: E.today() }); S.toast('照片已保存'); }
    catch (err) { S.toast(err && err.code === 'quota_or_state' ? '照片空间已满，删掉几张再试。' : '照片没有保存成功，换一张或稍后再试。', 'crit'); }
    setBusy(false);
  };
  if (!st.caps.photos) return html`<div class="empty"><span>${window.QS_OFFLINE ? '离线版不能存对比照' : '登录 claude.ai 打开这个页面后可以存对比照'}</span><span class="small">${window.QS_OFFLINE ? '其他功能不受影响。' : '现在的打开方式没有照片存储，其他功能不受影响。'}</span></div>`;
  return html`<div class="stack">
    <div class="row between">
      <${Seg} label="照片类型" value=${kind} onChange=${(v) => { setKind(v); setA(null); setB(null); }} options=${PHOTO_KINDS}/>
      <label class=${'btn' + (busy ? ' ghost' : '')}>${Icon.camera()}${busy ? '上传中…' : '添加照片'}<input id="photo-file" type="file" accept="image/*" hidden disabled=${busy} onChange=${onFile}/></label>
    </div>
    ${list.length >= 2 && a.id !== b.id ? html`<div class="stack-s">
      <div class="cmp">
        <img src=${S.photoUrl(b.id)} alt=${`${b.date} 的照片`}/>
        <img src=${S.photoUrl(a.id)} alt=${`${a.date} 的照片`} style=${`clip-path:inset(0 ${100 - pos}% 0 0)`}/>
        <div class="bar" style=${`left:${pos}%`}></div>
        <span class="lb" style="left:8px">${E.fmtShort(a.date)}</span><span class="lb" style="right:8px">${E.fmtShort(b.date)}</span>
        <input id="cmp-range" type="range" min="0" max="100" value=${pos} aria-label="拖动对比两张照片" onInput=${(e) => setPos(+e.target.value)}/>
      </div>
      <div class="grid-2" style="max-width:420px">
        <${Select} id="cmp-a" label="左边" value=${a.id} onChange=${setA}>${list.map((x) => html`<option value=${x.id}>${x.date}</option>`)}<//>
        <${Select} id="cmp-b" label="右边" value=${b.id} onChange=${setB}>${list.map((x) => html`<option value=${x.id}>${x.date}</option>`)}<//>
      </div>
    </div>` : null}
    ${list.length ? html`<div class="thumbs">${list.map((x) => html`<button type="button" class="thumb" key=${x.id} aria-label=${`查看 ${x.date} 的照片`} onClick=${() => S.openSheet(x.date, () => html`<${PhotoView} item=${x}/>`)}><img src=${S.photoUrl(x.id)} alt="" loading="lazy"/><span>${E.fmtShort(x.date)}</span></button>`)}</div>` : html`<div class="empty"><span>还没有${PHOTO_KINDS.find((k) => k.v === kind).l}照片</span><span class="small">同样的光线、距离和表情，每 4 周拍一次。两张以上就能拖动对比。</span></div>`}
    <p class="small muted">照片只存在这个私密页面里。以后如果分享这个页面，不要给对方编辑权限。</p>
  </div>`;
}

// ---------- 体成分 ----------
// [字段, 名称, 下限, 上限, 是否必填]
const COMP_FIELDS = [
  ['weight', '体重（kg）', 30, 250, true],
  ['pbf', '体脂率（%）', 3, 70, true],
  ['smm', '骨骼肌（kg）', 5, 80, true],
  ['fat', '体脂肪量（kg）', 1, 200, false],
  ['visceral', '内脏脂肪等级', 1, 30, false],
  ['whr', '腰臀比', 0.5, 1.5, false],
  ['bmr', '基础代谢（千卡）', 500, 4000, false],
  ['ecw', '细胞外水比', 0.3, 0.5, false],
];
const COMP_SEG = [['ra', '右臂'], ['la', '左臂'], ['tr', '躯干'], ['rl', '右腿'], ['ll', '左腿']];

function CompForm({ edit }) {
  const str = (v) => (v != null ? String(v) : '');
  const [f, setF] = useState(() => ({
    date: edit ? edit.date : E.today(),
    ...Object.fromEntries(COMP_FIELDS.map(([k]) => [k, edit ? str(edit[k]) : ''])),
    ...Object.fromEntries(COMP_SEG.map(([k]) => [k, edit && edit.lean ? str(edit.lean[k]) : ''])),
  }));
  const set = (k) => (v) => setF((cur) => ({ ...cur, [k]: v }));
  const items = S.state.comp.items;
  const save = () => {
    if (!f.date || f.date > E.today()) { S.toast('请选择今天或之前的日期', 'crit'); return; }
    const rec = { ...(edit || {}), id: edit ? edit.id : newId(), date: f.date };
    for (const [k, label, lo, hi, must] of COMP_FIELDS) {
      const t = f[k].trim();
      if (t === '') {
        if (must) { S.toast(`请填写${label}`, 'crit'); return; }
        delete rec[k];
        continue;
      }
      const v = parseFloat(t);
      if (!isFinite(v) || v < lo || v > hi) { S.toast(`${label}请填 ${lo} 到 ${hi} 之间的数字`, 'crit'); return; }
      rec[k] = v;
    }
    if (rec.fat == null) rec.fat = E.round1((rec.weight * rec.pbf) / 100);
    const lean = {};
    for (const [k, n] of COMP_SEG) {
      const t = f[k].trim();
      if (t === '') continue;
      const v = parseFloat(t);
      if (!isFinite(v) || v < 20 || v > 250) { S.toast(`${n}请填 20 到 250 之间的百分比`, 'crit'); return; }
      lean[k] = v;
    }
    if (Object.keys(lean).length) rec.lean = lean; else delete rec.lean;
    // 同一天只保留一条，图表才不会出现重叠的点
    S.setComp({ items: items.filter((x) => x.id !== rec.id && x.date !== rec.date).concat(rec).sort((a, b) => (a.date < b.date ? -1 : 1)) });
    S.closeSheet();
    S.toast('体测已保存');
  };
  const remove = () => { S.setComp({ items: items.filter((x) => x.id !== edit.id) }); S.closeSheet(); S.toast('已删除'); };
  return html`<div class="stack">
    <p class="note">把 InBody 报告上的数字填在这里。体重、体脂率和骨骼肌必填，其余没有就留空。</p>
    <div class="grid-2">
      <${Field} id="c-date" label="测量日期" type="date" value=${f.date} onInput=${set('date')}/>
      ${COMP_FIELDS.map(([k, label]) => html`<${Field} id=${'c-' + k} label=${label} inputmode="decimal" value=${f[k]} onInput=${set(k)}/>`)}
    </div>
    <details><summary>分段肌肉（可不填）</summary>
      <div class="stack-s">
        <p class="small muted">填报告 Segmental Lean Analysis 里每个部位的百分比。</p>
        <div class="grid-2">${COMP_SEG.map(([k, n]) => html`<${Field} id=${'c-' + k} label=${n + '（%）'} inputmode="decimal" value=${f[k]} onInput=${set(k)}/>`)}</div>
      </div>
    </details>
    <div class="row between"><button type="button" class="btn" onClick=${save}>保存</button>${edit ? html`<${Confirm} label="删除这条记录" sure="永久删除？再点一次" onYes=${remove}/>` : null}</div>
  </div>`;
}

function CompChart({ title, items, k, unit, target }) {
  const [ref, W] = useWidth();
  const [hi, setHi] = useState(null);
  const pts = items.filter((x) => x[k] != null);
  let chart = null;
  if (W > 0 && pts.length >= 2) {
    const H = 150, m = { l: 34, r: 42, t: 12, b: 24 };
    const first = pts[0].date, last = pts[pts.length - 1].date, span = Math.max(1, E.diff(last, first));
    const vals = pts.map((x) => x[k]).concat(target ? [target.v] : []);
    const ticks = niceTicks(Math.min(...vals) - 0.1, Math.max(...vals) + 0.1, 3);
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = (d) => m.l + (E.diff(d, first) / span) * (W - m.l - m.r);
    const Y = (v) => m.t + ((y1 - v) / (y1 - y0)) * (H - m.t - m.b);
    const end = pts[pts.length - 1];
    const cur = hi != null && pts[hi] ? pts[hi] : null;
    const pick = (e) => {
      const x = e.clientX - e.currentTarget.getBoundingClientRect().left;
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const dd = Math.abs(X(p.date) - x); if (dd < bd) { bd = dd; best = i; } });
      setHi(best);
    };
    const onKey = (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      setHi(E.clamp((hi == null ? pts.length - 1 : hi) + (e.key === 'ArrowLeft' ? -1 : 1), 0, pts.length - 1));
    };
    chart = html`<div class="chart" tabindex="0" role="img" aria-label=${`${title}趋势，最新 ${n1(end[k])} ${unit}`} onKeyDown=${onKey} onFocus=${() => setHi(pts.length - 1)} onBlur=${() => setHi(null)}>
      <svg viewBox=${`0 0 ${W} ${H}`} onPointerMove=${pick} onPointerDown=${pick} onPointerLeave=${() => setHi(null)}>
        ${ticks.map((v) => html`<g><line class="grid-line" x1=${m.l} x2=${W - m.r} y1=${Y(v)} y2=${Y(v)}/><text x=${m.l - 6} y=${Y(v) + 4} text-anchor="end">${v}</text></g>`)}
        <text x=${m.l} y=${H - 6}>${E.fmtShort(first)}</text>
        <text x=${X(last)} y=${H - 6} text-anchor="end">${E.fmtShort(last)}</text>
        ${target ? html`<g><line x1=${m.l} x2=${W - m.r} y1=${Y(target.v)} y2=${Y(target.v)} stroke="var(--good)" stroke-width="1"/><text x=${m.l + 4} y=${Y(target.v) - 5}>${target.l}</text></g>` : null}
        <path d=${pts.map((x, i) => `${i ? 'L' : 'M'}${X(x.date).toFixed(1)} ${Y(x[k]).toFixed(1)}`).join('')} fill="none" stroke="var(--rouge)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((x) => html`<circle cx=${X(x.date)} cy=${Y(x[k])} r="4.5" fill="var(--rouge)" stroke="var(--surface)" stroke-width="2"/>`)}
        <text x=${X(end.date) + 10} y=${Y(end[k]) + 4}>${n1(end[k])}</text>
        ${cur ? html`<line class="grid-line" x1=${X(cur.date)} x2=${X(cur.date)} y1=${m.t} y2=${H - m.b}/>` : null}
      </svg>
      ${cur ? html`<div class="tip" style=${`left:${E.clamp(X(cur.date) - 48, 0, Math.max(0, W - 110))}px`}><span class="small">${E.fmtShort(cur.date)}</span> <b>${n1(cur[k])}</b> ${unit}</div>` : null}
    </div>`;
  }
  return html`<div ref=${ref} class="stack-s"><span class="label">${title}</span>${chart}</div>`;
}

function CompSection({ pl, p }) {
  const items = S.state.comp.items, today = E.today();
  const open = (edit) => S.openSheet(edit ? '修改体测' : '记录体测', () => html`<${CompForm} edit=${edit}/>`);
  const head = html`<button type="button" class="btn ghost sm" onClick=${() => open(null)}>记录体测</button>`;
  const last = items[items.length - 1], prev = items[items.length - 2];
  if (!last) {
    return html`<${Sec} title="体成分" right=${head}><div class="empty"><span>还没有体测记录</span><span class="small">做完 InBody 后记在这里，就能看到体脂率和肌肉的变化。</span></div><//>`;
  }
  const rg = E.compRange(p.sex);
  const level = (v, [a, b]) => (v > b ? '偏高' : v < a ? '偏低' : '正常');
  const delta = (k, d) => (prev && prev[k] != null && last[k] != null ? ` · 较上次 ${last[k] - prev[k] > 0 ? '+' : ''}${(last[k] - prev[k]).toFixed(d)}` : '');
  const pair = (a, b) => (a === b ? String(a) : `${a}–${b}`);
  const next = pl.mode === 'lose' || pl.mode === 'recomp' ? E.compNext(last, p.sex) : null;
  const aims = [];
  if (next) {
    if (next.pbf) aims.push(`体脂率 ${pair(...next.pbf)}%`);
    aims.push(`骨骼肌约 ${n1(next.smm)} kg`);
    if (next.visceral) aims.push(`内脏脂肪 ${pair(...next.visceral)}`);
  }
  const when = next ? (next.date <= today ? '现在可以复测了。' : `建议 ${E.fmtDate(next.date).split(' ')[0]}前后复测。`) : '';
  const aimText = next ? `目标：${aims.join('，')}。同一台机器、相近时间测，结果才好比较。` : '';
  return html`<${Sec} title="体成分" right=${head}>
    <div class="small muted tn">最近一次 ${last.date}${last.time ? ' ' + last.time : ''}${last.source ? ' · ' + last.source : ''}</div>
    <div class="kv">
      <div><span class="v">${n1(last.pbf)}<small>%</small></span><span class="k">体脂率 · ${level(last.pbf, rg.pbf)}（正常 ${rg.pbf[0]}–${rg.pbf[1]}）${delta('pbf', 1)}</span></div>
      <div><span class="v">${n1(last.smm)}<small>kg</small></span><span class="k">骨骼肌${delta('smm', 1)}</span></div>
      ${last.visceral != null ? html`<div><span class="v">${last.visceral}</span><span class="k">内脏脂肪等级 · ${level(last.visceral, rg.visceral)}（正常 1–9）${delta('visceral', 0)}</span></div>` : null}
      ${last.whr != null ? html`<div><span class="v">${last.whr.toFixed(2)}</span><span class="k">腰臀比 · ${level(last.whr, rg.whr)}（正常 ${rg.whr[0]}–${rg.whr[1]}）${delta('whr', 2)}</span></div>` : null}
    </div>
    ${items.length >= 2 ? html`<div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <${CompChart} title="体脂率（%）" k="pbf" unit="%" items=${items} target=${next && next.pbf ? { v: (next.pbf[0] + next.pbf[1]) / 2, l: `下次目标 ${pair(...next.pbf)}` } : null}/>
      <${CompChart} title="骨骼肌（kg）" k="smm" unit="kg" items=${items} target=${next ? { v: next.smm, l: `下次目标 ${n1(next.smm)}` } : null}/>
    </div>` : null}
    <p class="note">${items.length < 2 ? '再测一次后，这里会显示体脂率和骨骼肌的趋势。' : ''}${when}${aimText}</p>
    <div>
      ${last.lean ? html`<details><summary>分段肌肉</summary><div class="stack-s">
        ${COMP_SEG.filter(([k]) => last.lean[k] != null).map(([k, n]) => html`<div class="bar-row"><span>${n}</span><${Meter} pct=${last.lean[k]}/><span class="v">${Math.round(last.lean[k])}%</span></div>`)}
        <p class="small muted">占标准肌肉量的百分比。手臂 80% 以上、躯干和腿 90% 以上算正常。</p>
      </div></details>` : null}
      <details><summary>全部记录</summary><div class="list">${items.slice().reverse().map((r) => html`<div class="li" key=${r.id}><div><div class="tn">${r.date}</div><div class="d tn">${n1(r.weight)} kg · 体脂 ${n1(r.pbf)}% · 骨骼肌 ${n1(r.smm)} kg${r.visceral != null ? ` · 内脏 ${r.visceral}` : ''}</div></div><button type="button" class="btn ghost sm" onClick=${() => open(r)}>修改</button></div>`)}</div></details>
    </div>
  <//>`;
}

function Body() {
  const st = S.state, p = st.profile, date = E.today(), ctx = ctxOf(date), pl = ctx.plan;
  const [range, setRange] = useState(90);
  const [table, setTable] = useState(false);
  if (!pl.showNumbers) {
    return html`<header><h1>身材</h1></header><${Sec} first=${true}><${Notice} s="warn" title="这一页已隐藏">按你的健康情况，体重、围度和对比照都不显示。现在更重要的是吃够、睡好和日常习惯。你可以在设置里修改。<//><//>`;
  }
  const all = E.weightSeries(st.days);
  const series = range === 'all' ? all : all.filter((x) => E.diff(date, x.date) < range);
  const last = all.length ? all[all.length - 1] : null;
  const pc = E.pace(all, pl, E.bodyImproving(st.days, st.comp.items, date));
  const et = last ? E.eta(last.avg, pl.goal, pc, pl, date) : null;
  const statusMap = {
    good: ['good', '节奏正常', null],
    fast: ['crit', '掉得偏快', '每周超过体重的 1%。建议每天加 150–200 千卡，优先加蛋白质和主食。前两周掉得快通常是水分，可以再观察一下。'],
    plateau: ['warn', '进入平台期', '连续 3 周几乎没变。先核对份量有没有低估，再每天多走 1500–2000 步。不要继续往下砍热量。'],
    recomp: ['good', '体型在变好', '体重这几周没怎么动，但腰围或体脂在下降，说明减脂和增肌在同时发生。继续现在的计划，不用减热量。'],
    up: ['warn', '略有回升', '先看周末和外卖，也可能是经期或训练后的水分。再观察一周，趋势才算数。'],
    down: ['warn', '体重在下降', '你现在的目标是增重，下降说明吃得还不够，可以每天加一份主食或蛋白质。'],
    none: ['info', '数据还不够', '连续记录两周左右，程序才能判断节奏。'],
  };
  const stat = statusMap[pc.status];
  const waist = measureSeries(st.days, 'waist');
  const curWaist = waist.length ? waist[waist.length - 1].v : null;
  const hip = measureSeries(st.days, 'hip');
  const wb = curWaist != null ? E.waistBand(curWaist, p.sex) : null;
  const toGoal = last && pl.goal != null ? Math.max(0, last.avg - pl.goal) : null;

  return html`
    <header class="stack-s"><h1>身材</h1></header>
    <div class="cols">
      <div class="span-2">
        <${Sec} first=${true}>
          <div class="row between" style="align-items:flex-end">
            <div class="stack-s">
              <span class="label">当前 7 日均值</span>
              <div class="big-fig">${last ? n1(last.avg) : n1(p.weight)}<small>kg</small></div>
            </div>
            <${Pill} s=${stat[0]}>${stat[1]}<//>
          </div>
          ${stat[2] ? html`<p class="note">${stat[2]}</p>` : null}
          <div class="row between">
            <${Seg} label="时间范围" value=${range} onChange=${setRange} options=${[{ v: 30, l: '30 天' }, { v: 90, l: '90 天' }, { v: 'all', l: '全部' }]}/>
            ${series.length >= 2 ? html`<button type="button" class="link" onClick=${() => setTable(!table)}>${table ? '看图表' : '看表格'}</button>` : null}
          </div>
          ${table && series.length >= 2 ? html`<div class="table-wrap"><table><thead><tr><th>日期</th><th>当天</th><th>7 日均值</th></tr></thead><tbody>${series.slice().reverse().map((s) => html`<tr><td>${s.date}</td><td>${n1(s.w)}</td><td>${n1(s.avg)}</td></tr>`)}</tbody></table></div>` : html`<${WeightChart} series=${series} goal=${pl.goal}/>`}
          <div class="kv">
            ${toGoal != null ? html`<div><span class="v">${n1(toGoal)}<small>kg</small></span><span class="k">距离目标 ${n1(pl.goal)} kg</span></div>` : null}
            <div><span class="v">${pc.perWeek != null ? (pc.perWeek > 0 ? '+' : '') + pc.perWeek.toFixed(2) : '—'}<small>kg/周</small></span><span class="k">最近两周的速度</span></div>
            ${et ? html`<div><span class="v">${et.weeks}<small>周</small></span><span class="k">体重${et.basis === 'trend' ? '按现在的速度' : '按计划速度'}约 ${E.fmtShort(et.date)} 到目标</span></div>` : null}
            <div><span class="v">${pl.bmi.toFixed(1)}</span><span class="k">BMI · ${pl.band.l}</span></div>
          </div>
        <//>
      </div>
      <div class="span-2"><${CompSection} pl=${pl} p=${p}/></div>
      <div>
        <${Sec} title="围度" note="体重不动的时候，腰围和照片常常已经在变。" right=${html`<button type="button" class="btn ghost sm" onClick=${() => S.openSheet('记录围度', () => html`<${MeasureForm} date=${date}/>`)}>记录</button>`}>
          ${curWaist != null ? html`<div class="row"><${Pill} s=${wb.s}>腰围 ${curWaist} cm · ${wb.l}<//>${hip.length ? html`<span class="small muted tn">腰臀比 ${(curWaist / hip[hip.length - 1].v).toFixed(2)}</span>` : null}</div>` : null}
          ${MEAS.some(([k]) => measureSeries(st.days, k).length) ? html`<div class="list">${MEAS.map(([k, n]) => {
            const s = measureSeries(st.days, k);
            if (!s.length) return null;
            const change = s[s.length - 1].v - s[0].v;
            return html`<div class="li"><div><div>${n}</div><div class="d tn">${s[s.length - 1].v} cm${s.length > 1 ? ` · 较首次 ${change > 0 ? '+' : ''}${change.toFixed(1)}` : ''}</div></div><${Spark} vals=${s.map((x) => x.v)}/></div>`;
          })}</div>` : html`<div class="empty"><span>还没有围度记录</span><span class="small">每两周量一次，这里会显示变化。</span></div>`}
        <//>
      </div>
      <div>
        <${Sec} title="对比照片"><${Photos}/><//>
      </div>
    </div>`;
}

</script>
<script>
/* 气色簿 · 护肤和医美。 */

const SCALES = [
  ['acne', '长痘', ['没有', '1–2 颗', '3–5 颗', '更多']],
  ['oil', '出油', ['不油', '微油', '偏油', '很油']],
  ['red', '泛红', ['没有', '轻微', '明显', '严重']],
  ['puffy', '水肿', ['没有', '轻微', '明显', '严重']],
];

function SkinDiary({ date }) {
  const d = S.day(date), skin = d.skin || {};
  const set = (k, v) => { const next = { ...skin }; if (next[k] === v) delete next[k]; else next[k] = v; S.patchDay(date, { skin: next }); };
  return html`<div class="stack-s">${SCALES.map(([k, n, opts]) => html`<div class="scale"><span>${n}</span>
    <div class="seg" role="radiogroup" aria-label=${n}>${opts.map((o, i) => html`<button type="button" role="radio" aria-checked=${skin[k] === i ? 'true' : 'false'} class=${skin[k] === i ? 'on' : ''} onClick=${() => set(k, i)}>${o}</button>`)}</div>
  </div>`)}</div>`;
}

function SkinHeat({ end }) {
  const days = S.state.days;
  const [hit, setHit] = useState(null);
  const dates = Array.from({ length: 28 }, (_, i) => E.addDays(end, i - 27));
  const any = dates.some((d) => days[d] && days[d].skin && Object.keys(days[d].skin).length);
  if (!any) return html`<div class="empty"><span>还没有皮肤记录</span><span class="small">每天花 10 秒选一下，这里会显示最近 4 周的变化。</span></div>`;
  const onHit = (e) => {
    const c = e.target.dataset && e.target.dataset.c;
    if (c !== undefined) setHit({ r: +e.target.dataset.r, c: +c });
  };
  const readout = hit ? (() => {
    const [k, n, opts] = SCALES[hit.r], dt = dates[hit.c], s = days[dt] && days[dt].skin;
    return `${E.fmtShort(dt)} · ${n} · ${s && s[k] != null ? opts[s[k]] : '没有记录'}`;
  })() : '点格子查看当天记录';
  return html`<div class="stack-s">
    <div class="heat" onPointerOver=${onHit} onPointerDown=${onHit}>
      ${SCALES.map(([k, n], r) => html`<span>${n}</span><div class="heat-row">${dates.map((dt, c) => {
        const s = days[dt] && days[dt].skin;
        const v = s ? s[k] : undefined;
        const cls = v == null ? 'none' : v === 0 ? '' : 'l' + v;
        return html`<i data-r=${r} data-c=${c} class=${cls + (hit && hit.r === r && hit.c === c ? ' hit' : '')}></i>`;
      })}</div>`)}
    </div>
    <div class="row between small muted"><span class="tn">${readout}</span>
      <span class="row" style="gap:4px;flex-wrap:nowrap">轻<i style="width:12px;height:12px;border-radius:2px;background:var(--surface-2);display:block"></i><i style="width:12px;height:12px;border-radius:2px;background:var(--heat-1);display:block"></i><i style="width:12px;height:12px;border-radius:2px;background:var(--heat-2);display:block"></i><i style="width:12px;height:12px;border-radius:2px;background:var(--heat-3);display:block"></i>重</span>
    </div>
    <details><summary>看表格</summary><div class="table-wrap"><table><thead><tr><th>日期</th>${SCALES.map(([, n]) => html`<th>${n}</th>`)}</tr></thead><tbody>${dates.slice().reverse().filter((dt) => days[dt] && days[dt].skin).map((dt) => html`<tr><td>${E.fmtShort(dt)}</td>${SCALES.map(([k, , o]) => html`<td>${days[dt].skin[k] != null ? o[days[dt].skin[k]] : '—'}</td>`)}</tr>`)}</tbody></table></div></details>
  </div>`;
}

function Skin() {
  const date = UI.date, st = S.state, p = st.profile, d = S.day(date), ctx = ctxOf(date), sk = ctx.skin;
  const th = E.things(d, ctx.plan, p);
  const isDone = (k) => th.find((x) => x.k === k).done;
  const flip = (k) => S.patchDay(date, { t: { ...(d.t || {}), [k]: !isDone(k) } });
  const tr = E.triggers(st.days);
  const term = E.solarTerm(date);
  const preg = !!(p.safety && p.safety.preg);
  return html`
    <header class="stack-s"><h1>护肤</h1><${DateBar}/></header>
    <div class="cols">
      <div class="span-2">
        <${Sec} first=${true} title=${sk.mode === 'normal' ? `今晚是${sk.night.n}` : '今天用修护方案'} right=${html`<${Pill} s=${sk.mode === 'normal' ? 'info' : 'warn'}>${sk.mode === 'recovery' ? '术后恢复' : sk.mode === 'barrier' ? '屏障预警' : sk.stageName}<//>`}>
          ${sk.reason ? html`<${Notice} s="warn">${sk.reason}<//>` : html`<p class="note">${sk.stageNote}</p>`}
          ${sk.mode === 'normal' && sk.stage > 1 ? html`<div class="nights" aria-label="四晚轮换">${sk.cycle.map((n, i) => html`<div class=${i === sk.idx ? 'on' : ''}>第 ${i + 1} 晚<br/>${n.n.replace('夜', '')}</div>`)}</div>` : null}
          ${preg ? html`<${Notice} s="crit">孕期、备孕和哺乳期已去掉 A 醇和水杨酸。具体用什么请和医生确认。<//>` : null}
          <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
            <div class="stack">
              <div class="row between"><h3>早上</h3><${Tick} on=${isDone('am')} label="早护防晒完成" onClick=${() => flip('am')}/></div>
              <ol class="routine">${sk.am.map((x) => html`<li><div>${x.t}<span>${x.d}</span></div></li>`)}</ol>
            </div>
            <div class="stack">
              <div class="row between"><h3>晚上</h3><${Tick} on=${isDone('pm')} label="晚护完成" onClick=${() => flip('pm')}/></div>
              <ol class="routine">${sk.pm.map((x) => html`<li><div>${x.t}<span>${x.d}</span></div></li>`)}</ol>
              ${sk.mode === 'normal' ? html`<p class="small muted">${sk.night.tip}</p>` : null}
            </div>
          </div>
          <p class="small muted">${term.name}时节：${term.tip}</p>
        <//>
      </div>
      <div>
        <${Sec} title="皮肤日记" note="每天选一下。连续两天泛红明显，程序会自动把活性换成修护。"><${SkinDiary} date=${date}/><//>
      </div>
      <div>
        <${Sec} title="最近 4 周"><${SkinHeat} end=${date}/>
          ${tr.length ? html`<div class="stack-s">${tr.map((x) => html`<${Notice}>${x.cause}后的第二天，${x.metric}平均高 ${x.delta} 分（${x.n} 次记录）。<//>`)}<p class="small muted">这是相关性，不代表一定是这个原因，可以自己试着调整看看。</p></div>` : null}
        <//>
      </div>
      <div class="span-2">
        <${Sec} title="脸型和水肿">
          <div>
            <details><summary>早起水肿怎么办</summary><p class="note">前一晚少盐少酒，睡够 7 小时，枕头略垫高。早上用冷水洗脸或冷敷 1–2 分钟。长期严重水肿或单侧突然肿胀要去医院。</p></details>
            <details><summary>想要下颌线</summary><p class="note">脂肪不能局部减少，下颌线主要靠整体减脂。头前伸会让下颌线变模糊，体态练习里的下巴后缩有帮助。少嚼口香糖，咬肌会轻松一些。</p></details>
            <details><summary>面部按摩和面部瑜伽</summary><p class="note">目前只有小规模研究提示有轻微改善，证据有限。想做就用足够的润滑、轻力度，长痘发炎的时候不要按。</p></details>
            <details><summary>成分怎么搭</summary><p class="note">一次只加一种新产品，观察 2 周。A 醇和酸类不要同一晚用。VC 放早上，防晒每天都涂，阴天和靠窗的室内也要。所有提亮和抗老的效果，都依赖防晒留住。</p></details>
            <details><summary>什么时候该看皮肤科</summary><p class="note">痘痘红肿疼痛、有结节或囊肿，或连续 3 个月没有好转；用护肤品后持续灼痛；疑似黄褐斑；痣的形状或颜色变了。这些情况不要自己处理。</p></details>
          </div>
        <//>
      </div>
    </div>`;
}

// ---------- 医美 ----------
const REG = {
  device: '这类产品按医疗器械管理，核对注册证号（国械注准 / 国械注进）。',
  drug: '肉毒素按药品管理，核对药品批准文号或进口药品注册证，批次可查批签发。',
  equip: '设备应是注册过的医疗器械，让机构出示注册证，治疗头当面拆封。',
};

function MedForm({ edit, preset }) {
  const pre = preset || {};
  const blank = { id: newId(), pid: pre.pid || 'ipl', name: pre.name || '', date: E.today(), site: '全脸', clinic: pre.clinic || '', doctor: '', product: '', dose: '', price: pre.price ? String(pre.price) : '', rating: 0, note: '' };
  const [f, setF] = useState(() => (edit ? { ...edit, price: edit.price != null ? String(edit.price) : '' } : blank));
  const [nextTouched, setTouched] = useState(!!(edit && edit.next));
  const [next, setNext] = useState(edit ? edit.next || '' : '');
  const set = (k) => (v) => setF({ ...f, [k]: v });
  const c = f.pid === 'custom' ? null : QS.MED.find((m) => m.id === f.pid);
  const suggested = c && c.interval && f.date ? E.addDays(f.date, c.interval) : '';
  const nextV = nextTouched ? next : suggested;
  const save = () => {
    if (!f.date) { S.toast('请选择日期', 'crit'); return; }
    if (f.date > E.today()) { S.toast('这里记录已经做过的项目，将来的安排放到想做清单。', 'crit'); return; }
    if (f.pid === 'custom' && !f.name.trim()) { S.toast('请填写项目名称', 'crit'); return; }
    const rec = { ...f, name: f.pid === 'custom' ? f.name.trim() : '', price: f.price.trim() === '' ? null : Math.max(0, +f.price || 0), next: nextV || null };
    const items = S.state.med.items.filter((x) => x.id !== rec.id).concat(rec).sort((a, b) => (a.date < b.date ? 1 : -1));
    S.setMed({ items, wishes: S.state.med.wishes.filter((x) => x.id !== pre.wishId) });
    S.closeSheet();
    S.toast('已保存');
  };
  const remove = () => {
    S.setMed({ ...S.state.med, items: S.state.med.items.filter((x) => x.id !== f.id) });
    S.closeSheet();
    S.toast('已删除');
  };
  return html`<div class="stack">
    <${Select} id="med-pid" label="项目" value=${f.pid} onChange=${set('pid')}>${QS.MED.map((m) => html`<option value=${m.id}>${m.n}</option>`)}<option value="custom">其他项目</option><//>
    ${f.pid === 'custom' ? html`<${Field} id="med-name" label="项目名称" value=${f.name} onInput=${set('name')}/>` : null}
    <div class="grid-2">
      <${Field} id="med-date" label="做的日期" type="date" value=${f.date} onInput=${set('date')}/>
      <${Field} id="med-site" label="部位" value=${f.site} onInput=${set('site')}/>
      <${Field} id="med-clinic" label="机构" value=${f.clinic} onInput=${set('clinic')}/>
      <${Field} id="med-doctor" label="医生" value=${f.doctor} onInput=${set('doctor')}/>
      <${Field} id="med-product" label="产品和批号" value=${f.product} onInput=${set('product')}/>
      <${Field} id="med-dose" label="用量或参数" value=${f.dose} onInput=${set('dose')}/>
      <${Field} id="med-price" label="费用（元）" inputmode="numeric" value=${f.price} onInput=${set('price')}/>
      <${Field} id="med-next" label="下次提醒日期" type="date" value=${nextV} onInput=${(v) => { setTouched(true); setNext(v); }}/>
    </div>
    ${c ? html`<p class="small muted">${c.intervalText}。</p>` : null}
    <div class="stack-s"><span class="label">满意度</span><${Seg} label="满意度" value=${f.rating} onChange=${set('rating')} options=${[{ v: 1, l: '不满意' }, { v: 2, l: '一般' }, { v: 3, l: '满意' }, { v: 4, l: '很满意' }]}/></div>
    <${Area} id="med-note" label="备注" value=${f.note} onInput=${set('note')} placeholder="术后反应、医生叮嘱"/>
    <div class="row between"><button type="button" class="btn" onClick=${save}>保存</button>${edit ? html`<${Confirm} label="删除这条记录" sure="永久删除？再点一次" onYes=${remove}/>` : null}</div>
  </div>`;
}

function WishForm() {
  const [f, setF] = useState({ pid: 'ipl', name: '', clinic: '', price: '', note: '' });
  const set = (k) => (v) => setF({ ...f, [k]: v });
  const save = () => {
    if (f.pid === 'custom' && !f.name.trim()) { S.toast('请填写项目名称', 'crit'); return; }
    S.setMed({ ...S.state.med, wishes: [...S.state.med.wishes, { id: newId(), ...f, name: f.name.trim(), added: E.today(), checks: {} }] });
    S.closeSheet();
  };
  return html`<div class="stack">
    <${Select} id="wish-pid" label="想做的项目" value=${f.pid} onChange=${set('pid')}>${QS.MED.map((m) => html`<option value=${m.id}>${m.n}</option>`)}<option value="custom">其他项目</option><//>
    ${f.pid === 'custom' ? html`<${Field} id="wish-name" label="项目名称" value=${f.name} onInput=${set('name')}/>` : null}
    <div class="grid-2">
      <${Field} id="wish-clinic" label="考虑的机构" value=${f.clinic} onInput=${set('clinic')}/>
      <${Field} id="wish-price" label="报价（元）" inputmode="numeric" value=${f.price} onInput=${set('price')}/>
    </div>
    <${Area} id="wish-note" label="想解决什么问题" value=${f.note} onInput=${set('note')}/>
    <div><button type="button" class="btn" onClick=${save}>加入清单</button></div>
  </div>`;
}

function WishCard({ w }) {
  const c = w.pid === 'custom' ? null : QS.MED.find((m) => m.id === w.pid);
  const name = c ? c.n : w.name;
  const n = QS.MED_CHECKS.filter((x) => w.checks[x.k]).length;
  const days = E.diff(E.today(), w.added);
  const update = (patch) => S.setMed({ ...S.state.med, wishes: S.state.med.wishes.map((x) => (x.id === w.id ? { ...x, ...patch } : x)) });
  const remove = () => S.setMed({ ...S.state.med, wishes: S.state.med.wishes.filter((x) => x.id !== w.id) });
  return html`<details>
    <summary><span>${name}<span class="small muted" style="font-weight:400"> · 核对 ${n}/${QS.MED_CHECKS.length} · 已考虑 ${days} 天</span></span></summary>
    <div class="stack-s">
      ${w.clinic || w.price ? html`<p class="small muted">${w.clinic}${w.clinic && w.price ? ' · ' : ''}${w.price ? `报价 ${w.price} 元` : ''}</p>` : null}
      ${w.note ? html`<p class="small">${w.note}</p>` : null}
      ${days < 7 ? html`<${Notice} s="info">建议至少考虑 7 天再决定，还有 ${7 - days} 天。价格活动不是决定的理由。<//>` : null}
      <div>${QS.MED_CHECKS.map((x) => html`<label class="check"><input id=${`chk-${w.id}-${x.k}`} type="checkbox" checked=${!!w.checks[x.k]} onChange=${(e) => update({ checks: { ...w.checks, [x.k]: e.target.checked } })}/><span>${x.t}<br/><span class="small muted">${x.h}</span></span></label>`)}</div>
      ${c ? html`<p class="small muted">${REG[c.reg]}</p>` : null}
      <div class="row between"><button type="button" class="btn ghost sm" onClick=${() => S.openSheet('记录已做项目', () => html`<${MedForm} preset=${{ pid: w.pid, name: w.name, clinic: w.clinic, price: w.price, wishId: w.id }}/>`)}>已做，转成记录</button><${Confirm} label="移出清单" sure="确定移出？再点一次" onYes=${remove}/></div>
    </div>
  </details>`;
}

function RecoveryPanel({ r }) {
  const [a, b] = r.c.phases;
  const cells = Array.from({ length: 15 }, (_, i) => i);
  const bg = (i) => (i <= a ? 'var(--heat-3)' : i <= b ? 'var(--heat-2)' : 'var(--heat-1)');
  return html`<div class="stack">
    <div class="row between"><h3>${r.c.n} · 第 ${r.day} 天</h3><${Pill} s=${r.phase === '稳定期' ? 'good' : 'warn'}>${r.phase}<//></div>
    <div style="display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:2px" role="img" aria-label=${`14 天修复周期，今天第 ${r.day} 天，处于${r.phase}`}>
      ${cells.map((i) => html`<div style=${`height:${i === r.day ? 20 : 12}px;border-radius:2px;align-self:end;background:${bg(i)};${i === r.day ? 'outline:2px solid var(--ink);' : ''}`}></div>`)}
    </div>
    <div class="legend"><span><i style="background:var(--heat-3);height:8px"></i>急性期</span><span><i style="background:var(--heat-2);height:8px"></i>恢复期</span><span><i style="background:var(--heat-1);height:8px"></i>稳定期</span></div>
    ${r.pause ? html`<p class="note">A 醇和酸类暂停到 ${E.fmtShort(r.resume)}，今日护肤已自动换成修护方案。</p>` : null}
    ${r.c.care && r.c.care.length ? html`<ol class="routine">${r.c.care.map((x) => html`<li><div>${x}</div></li>`)}</ol>` : null}
    <p class="small muted">周期是一般参考，医生的术后医嘱优先。出现剧痛、皮肤发白发紫、视力变化或持续加重，立即联系医生或去医院。</p>
  </div>`;
}

function Med() {
  const st = S.state, p = st.profile, date = E.today(), ctx = ctxOf(date), pl = ctx.plan;
  const { items, wishes } = st.med;
  const year = date.slice(0, 4);
  const spent = items.filter((x) => x.date.startsWith(year)).reduce((s, x) => s + (x.price || 0), 0);
  const budget = p.medBudget || null;
  const dues = E.dues(items, date).filter((x) => x.left <= 60).slice(0, 5);
  const preg = !!(p.safety && p.safety.preg), minor = !!(p.safety && p.safety.under18);
  const concerns = (p.concerns || []).map((c) => (c === 'puffy' ? 'contour' : c));
  const losing = pl.mode === 'lose';
  const [cat, setCat] = useState('all');
  const cats = ['注射', '光电', '焕肤', '皮肤护理', '手术类'];
  const shown = QS.MED.filter((m) => cat === 'all' || m.cat === cat);
  return html`
    <header class="stack-s"><h1>医美</h1></header>
    ${preg || minor ? html`<${Sec} first=${true}><${Notice} s="crit" title=${preg ? '孕期、备孕和哺乳期建议暂缓' : '未满 18 岁不建议做医美'}>${preg ? '注射和光电类项目都请先和产科医生沟通。' : '皮肤问题请和家长一起看皮肤科。'}<//><//>` : null}
    <div class="cols">
      <div>
        <${Sec} first=${!(preg || minor)} title="概览" right=${html`<button type="button" class="btn sm" onClick=${() => S.openSheet('记录已做项目', () => html`<${MedForm}/>`)}>记录项目</button>`}>
          <div class="kv">
            <div><span class="v">${n0(spent)}<small>元</small></span><span class="k">${year} 年已花</span></div>
            <div><span class="v">${items.length}<small>次</small></span><span class="k">累计记录</span></div>
            ${budget ? html`<div><span class="v">${n0(Math.max(0, budget - spent))}<small>元</small></span><span class="k">预算剩余</span></div>` : null}
          </div>
          ${budget ? html`<${Meter} pct=${(spent / budget) * 100} over=${spent > budget}/>` : html`<p class="small muted">可以在设置里填年度预算，这里会显示剩余。</p>`}
          ${losing ? html`<${Notice} s="info">你正在减重。填充、线雕和超声类项目会受脸部脂肪变化影响，等体重稳定后再评估更稳妥。<//>` : null}
        <//>
        ${ctx.recovery ? html`<${Sec} title="恢复期"><${RecoveryPanel} r=${ctx.recovery}/><//>` : null}
        ${dues.length ? html`<${Sec} title="快到时间的项目">
          <div class="list">${dues.map((x) => html`<div class="li"><div><div>${x.c.n}</div><div class="d tn">上次 ${x.r.date}</div></div><${Pill} s=${x.left < 0 ? 'warn' : 'info'}>${x.left < 0 ? `已过 ${-x.left} 天` : x.left === 0 ? '今天' : `${x.left} 天后`}<//></div>`)}</div>
        <//>` : null}
        <${Sec} title="项目记录">
          ${items.length ? html`<div class="list">${items.map((r) => { const c = E.medInfo(r); return html`<div class="li" key=${r.id}><div><div>${c.n}</div><div class="d tn">${r.date}${r.clinic ? ' · ' + r.clinic : ''}${r.price != null ? ` · ${n0(r.price)} 元` : ''}</div></div><button type="button" class="btn ghost sm" onClick=${() => S.openSheet('修改记录', () => html`<${MedForm} edit=${r}/>`)}>修改</button></div>`; })}</div>` : html`<div class="empty"><span>还没有项目记录</span><span class="small">记录之后，程序会提醒复做时间，并在恢复期自动调整护肤。</span></div>`}
        <//>
      </div>
      <div>
        <${Sec} title="想做清单" note="先放进来，核对资质再决定。" right=${html`<button type="button" class="btn ghost sm" onClick=${() => S.openSheet('加入想做清单', () => html`<${WishForm}/>`)}>添加</button>`}>
          ${wishes.length ? html`<div>${wishes.map((w) => html`<${WishCard} key=${w.id} w=${w}/>`)}</div>` : html`<div class="empty"><span>清单是空的</span><span class="small">添加后会有 6 项安全核对和 7 天冷静期。</span></div>`}
        <//>
        <${Sec} title="针对你的问题">
          <div class="list">${concerns.map((c) => html`<div class="li" style="grid-template-columns:minmax(0,1fr)"><div><div>${QS.MED_ADVICE[c].t}</div><div class="d">${QS.MED_ADVICE[c].d}</div></div></div>`)}</div>
        <//>
      </div>
      <div class="span-2">
        <${Sec} title="项目参考" note="间隔和恢复期是常见范围，因人和产品而异，以面诊医生的方案为准。">
          <${Seg} label="项目分类" value=${cat} onChange=${setCat} options=${[{ v: 'all', l: '全部' }, ...cats.map((c) => ({ v: c, l: c }))]}/>
          <div>${shown.map((m) => html`<details key=${m.id}>
            <summary><span>${m.n}<span class="small muted" style="font-weight:400"> · ${m.for}</span></span></summary>
            <div class="stack-s note">
              <p><b>效果：</b>${m.effect}</p>
              <p><b>间隔：</b>${m.intervalText}</p>
              <p><b>恢复：</b>${m.down}</p>
              <p><b>风险：</b>${m.risk}</p>
              <p><b>术后：</b>${m.care.join('；')}</p>
              <p><b>核对：</b>${REG[m.reg]}</p>
              ${m.weightNote && losing ? html`<p><b>提醒：</b>体重变化会影响效果，减重稳定后再考虑。</p>` : null}
            </div>
          </details>`)}</div>
          <p class="small muted">没有批文的针剂（比如网上常见的“美白针”“溶脂针”）不要打。资质查询：国家卫健委官网（www.nhc.gov.cn）、“医通办”App、国家药监局官网（www.nmpa.gov.cn）数据查询。</p>
        <//>
      </div>
    </div>`;
}

</script>
<script>
/* 气色簿 · 复盘、设置、首次设置和应用外壳。 */

// ---------- 复盘 ----------
function MonthFlowers({ month, pl, p }) {
  const days = S.state.days;
  const [y, m] = month.split('-').map(Number);
  const firstDay = `${month}-01`;
  const n = new Date(y, m, 0).getDate();
  const offset = (E.parse(firstDay).getDay() + 6) % 7;
  const today = E.today();
  const open = (dt) => { UI.date = dt; UI.followToday = dt === today; location.hash = 'today'; S.emit(); };
  return html`<div class="cal">
    ${['一', '二', '三', '四', '五', '六', '日'].map((w) => html`<div class="wd">${w}</div>`)}
    ${Array.from({ length: offset }, () => html`<div></div>`)}
    ${Array.from({ length: n }, (_, i) => {
      const dt = E.addDays(firstDay, i), d = days[dt];
      const states = d ? E.things(d, pl, p).map((x) => x.done) : QS.THING_KEYS.map(() => false);
      const cnt = states.filter(Boolean).length;
      return html`<button type="button" class=${dt === today ? 'today' : ''} disabled=${dt > today} aria-label=${`${E.fmtShort(dt)}，完成 ${cnt} 件`} onClick=${() => open(dt)}><${Flower} small=${true} states=${states} size=${34}/><span>${i + 1}</span></button>`;
    })}
  </div>`;
}

function WeeklyAI({ wk, summary }) {
  const st = S.state;
  const saved = st.reviews.weeks[wk];
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState('');
  const [err, setErr] = useState('');
  const ctl = useRef(null);
  useEffect(() => { setLive(''); setErr(''); }, [wk]);
  const run = async () => {
    setBusy(true); setErr(''); setLive('');
    ctl.current = new AbortController();
    try {
      const p = st.profile, pl = ctxOf(E.today()).plan;
      const payload = { goals: p.goals, concerns: p.concerns, phase: pl.modeName, targets: pl.showNumbers ? { kcal: pl.kcal, protein: pl.protein, water: pl.water, trainDays: p.trainDays } : { water: pl.water, trainDays: p.trainDays }, week: { ...summary, kcal: pl.showNumbers ? summary.kcal : undefined, weight: pl.showNumbers ? summary.weight : undefined, weightDelta: pl.showNumbers ? summary.weightDelta : undefined } };
      const r = await AI.weekly(payload, ({ text }) => setLive(text), ctl.current.signal);
      S.setReviews({ weeks: { ...S.state.reviews.weeks, [wk]: { text: r.text, at: E.today() } } });
      setLive('');
    } catch (e) {
      if (e && e.code !== 'cancelled') setErr(AI.errorText(e));
      if (e && e.text) setLive(e.text);
    }
    setBusy(false);
  };
  const text = live || (saved && saved.text);
  if (!st.caps.ai) return html`<p class="note">${window.QS_OFFLINE ? '离线版没有 Claude 写复盘的功能。' : '用 claude.ai 账号打开这个页面后，Claude 可以根据这一周的数据写复盘。'}</p>`;
  return html`<div class="stack">
    ${text ? html`<div class="review-text">${text}</div>` : busy ? html`<p class="muted">Claude 正在看你这周的数据，通常要半分钟左右…</p>` : html`<p class="note">Claude 会根据这一周的数据，告诉你做得好的地方、最该调整的一两件事。</p>`}
    ${err ? html`<p class="err">${err}</p>` : null}
    <div class="row">
      ${busy ? html`<button type="button" class="btn ghost" onClick=${() => ctl.current && ctl.current.abort()}>停止</button>` : html`<button type="button" class=${'btn' + (saved ? ' ghost' : '')} disabled=${summary.logged === 0} onClick=${run}>${saved ? '重新写一份' : '让 Claude 写复盘'}</button>`}
      ${summary.logged === 0 ? html`<span class="small muted">这一周还没有记录</span>` : null}
    </div>
  </div>`;
}

function Coach() {
  const st = S.state;
  const [turns, setTurns] = useState([]);
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState('');
  const [err, setErr] = useState('');
  const ctl = useRef(null);
  const send = async (q) => {
    const msg = (q || text).trim();
    if (!msg || busy) return;
    const next = [...turns, { role: 'user', content: msg }];
    setTurns(next); setText(''); setBusy(true); setErr(''); setLive('');
    ctl.current = new AbortController();
    try {
      const r = await AI.chat(next, aiContext(), ({ text: t }) => setLive(t), ctl.current.signal);
      setTurns([...next, { role: 'assistant', content: r.text }]);
    } catch (e) {
      if (e && e.code !== 'cancelled') setErr(AI.errorText(e));
      if (e && e.text) setTurns([...next, { role: 'assistant', content: e.text }]);
    }
    setLive(''); setBusy(false);
  };
  if (!st.caps.ai) return html`<p class="note">${window.QS_OFFLINE ? '离线版不能在这里问 Claude。' : '用 claude.ai 账号打开这个页面后，可以在这里问 Claude。'}</p>`;
  const ideas = ['我这周最该改什么？', '外卖怎么点更适合我？', '按我的皮肤问题，先解决哪个？'];
  return html`<div class="stack">
    ${turns.length || live ? html`<div class="stack-s" style="display:grid">
      ${turns.map((t) => html`<div class=${'bubble' + (t.role === 'user' ? ' me' : '')}>${t.content}</div>`)}
      ${live ? html`<div class="bubble">${live}</div>` : null}
    </div>` : html`<div class="chips">${ideas.map((q) => html`<button type="button" class="chip" onClick=${() => send(q)}>${q}</button>`)}</div>`}
    ${busy && !live ? html`<p class="small muted">Claude 正在想…</p>` : null}
    ${err ? html`<p class="err">${err}</p>` : null}
    <div class="row" style="flex-wrap:nowrap">
      <input id="coach-q" class="plain" type="text" autocomplete="off" aria-label="问 Claude" placeholder="问问饮食、训练、护肤或医美" value=${text} onInput=${(e) => setText(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter' && !e.isComposing) send(); }}/>
      ${busy ? html`<button type="button" class="btn ghost" onClick=${() => ctl.current && ctl.current.abort()}>停止</button>` : html`<button type="button" class="btn" onClick=${() => send()}>发送</button>`}
    </div>
    <p class="small muted">发送时会带上最近 14 天的摘要和最近两次体测，不含昵称、机构和医生姓名，也不发送对比照片。</p>
  </div>`;
}

function Review() {
  const st = S.state, p = st.profile, today = E.today(), ctx = ctxOf(today), pl = ctx.plan;
  const [wk, setWk] = useState(E.weekStart(today));
  const [month, setMonth] = useState(today.slice(0, 7));
  const sum = E.weekSummary(st.days, wk, pl, p);
  const shiftMonth = (n) => { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + n, 15); const nm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; if (nm <= today.slice(0, 7)) setMonth(nm); };
  const isThis = wk === E.weekStart(today);
  return html`
    <header class="stack-s"><h1>复盘</h1></header>
    <div class="cols">
      <div>
        <${Sec} first=${true}>
          <div class="row between">
            <div class="row" style="gap:2px">
              <button type="button" class="icon-btn" aria-label="上一周" onClick=${() => setWk(E.addDays(wk, -7))}>${Icon.left()}</button>
              <strong class="tn">${E.fmtShort(sum.start)} – ${E.fmtShort(sum.end)}</strong>
              <button type="button" class="icon-btn" aria-label="下一周" disabled=${isThis} onClick=${() => setWk(E.addDays(wk, 7))}>${Icon.right()}</button>
            </div>
            <${Pill} s="info">开花 ${sum.blooms} 天<//>
          </div>
          <div class="kv">
            <div><span class="v">${sum.workouts}<small>/ ${p.trainDays} 次</small></span><span class="k">训练</span></div>
            <div><span class="v">${sum.sleep != null ? n1(sum.sleep) : '—'}<small>小时</small></span><span class="k">平均睡眠</span></div>
            <div><span class="v">${n0(sum.water)}<small>ml</small></span><span class="k">平均饮水</span></div>
            ${pl.showNumbers ? html`<div><span class="v">${sum.weightDelta != null ? (sum.weightDelta > 0 ? '+' : '') + sum.weightDelta.toFixed(1) : '—'}<small>kg</small></span><span class="k">7 日均值变化</span></div>
            <div><span class="v">${sum.proteinHit}<small>天</small></span><span class="k">蛋白质达标</span></div>` : null}
            <div><span class="v">${sum.cardio}<small>分钟</small></span><span class="k">有氧</span></div>
          </div>
        <//>
        <${Sec} title="七件事完成情况">
          <div class="stack-s">${QS.THING_KEYS.map((k) => k).sort((a, b) => sum.counts[b] - sum.counts[a]).map((k) => html`<div class="bar-row"><span>${QS.THINGS[k].n}</span><${Meter} pct=${(sum.counts[k] / 7) * 100}/><span class="v">${sum.counts[k]}/7</span></div>`)}</div>
        <//>
        <${Sec} title="Claude 周复盘"><${WeeklyAI} wk=${wk} summary=${sum}/><//>
      </div>
      <div>
        <${Sec} first=${true} title="花历" right=${html`<div class="row" style="gap:2px"><button type="button" class="icon-btn" aria-label="上个月" onClick=${() => shiftMonth(-1)}>${Icon.left()}</button><strong class="tn">${month.replace('-', '.')}</strong><button type="button" class="icon-btn" aria-label="下个月" disabled=${month === today.slice(0, 7)} onClick=${() => shiftMonth(1)}>${Icon.right()}</button></div>`}>
          <${MonthFlowers} month=${month} pl=${pl} p=${p}/>
          <p class="small muted">每一瓣是一件事，点某一天可以补记。</p>
        <//>
        <${Sec} title="问 Claude"><${Coach}/><//>
      </div>
    </div>`;
}

// ---------- 资料表单（首次设置和设置页共用） ----------
const GOAL_OPTS = [{ v: 'lose', l: '减脂减重' }, { v: 'shape', l: '塑形紧致' }, { v: 'posture', l: '改善体态' }, { v: 'muscle', l: '增肌变强' }];
const CONCERN_OPTS = [{ v: 'acne', l: '痘痘出油' }, { v: 'tone', l: '暗沉色斑' }, { v: 'aging', l: '细纹松弛' }, { v: 'puffy', l: '水肿和脸型' }];
const SAFETY_OPTS = [
  ['preg', '正在备孕、怀孕或哺乳'],
  ['under18', '未满 18 岁'],
  ['ed', '有进食障碍史，或对吃东西和体重感到很痛苦'],
  ['chronic', '有慢性病或长期用药（如糖尿病、肾病、甲状腺问题）'],
];
const toggleIn = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

function BasicsFields({ f, set }) {
  return html`<div class="stack">
    <${Field} id="p-nick" label="怎么称呼你（可不填）" value=${f.nick} onInput=${set('nick')}/>
    <div class="stack-s"><span class="label">生理性别（用于计算代谢）</span><${Seg} label="生理性别" value=${f.sex} onChange=${set('sex')} options=${[{ v: 'f', l: '女' }, { v: 'm', l: '男' }]}/></div>
    <div class="grid-2">
      <${Field} id="p-year" label="出生年份" inputmode="numeric" placeholder="1996" value=${f.birthYear} onInput=${set('birthYear')}/>
      <${Field} id="p-height" label="身高（cm）" inputmode="decimal" placeholder="165" value=${f.height} onInput=${set('height')}/>
      <${Field} id="p-weight" label="现在体重（kg）" inputmode="decimal" placeholder="60" value=${f.weight} onInput=${set('weight')}/>
      <${Field} id="p-goal" label="目标体重（kg，可不填）" inputmode="decimal" value=${f.goalWeight} onInput=${set('goalWeight')}/>
    </div>
    <div class="stack-s"><span class="label">日常活动量（不算专门训练）</span><${Seg} label="日常活动量" value=${f.activity} onChange=${set('activity')} options=${[{ v: 'sedentary', l: '久坐' }, { v: 'light', l: '偏少' }, { v: 'moderate', l: '中等' }, { v: 'high', l: '较多' }]}/></div>
    <div class="stack-s"><span class="label">身材目标</span><${Chips} value=${f.goals} options=${GOAL_OPTS} onToggle=${(v) => set('goals')(toggleIn(f.goals, v))}/></div>
  </div>`;
}
function TrainFields({ f, set }) {
  return html`<div class="stack">
    <div class="stack-s"><span class="label">每周能练几天</span><${Seg} label="每周训练天数" value=${f.trainDays} onChange=${set('trainDays')} options=${[2, 3, 4, 5].map((n) => ({ v: n, l: `${n} 天` }))}/></div>
    <div class="stack-s"><span class="label">力量训练基础</span><${Seg} label="训练基础" value=${f.level} onChange=${set('level')} options=${[{ v: 'new', l: '新手' }, { v: 'mid', l: '练过一阵' }, { v: 'pro', l: '有经验' }]}/></div>
    <div class="stack-s"><span class="label">默认训练场地（每次开练前都能切换）</span><${Seg} label="默认场地" value=${f.venue} onChange=${set('venue')} options=${[{ v: 'gym', l: '健身房' }, { v: 'home', l: '在家' }]}/></div>
    <p class="small muted">在家的版本默认有一对哑铃和弹力带，没有的话先用背包、水瓶代替。</p>
  </div>`;
}
function SkinFields({ f, set }) {
  return html`<div class="stack">
    <div class="stack-s"><span class="label">肤质</span><${Seg} label="肤质" value=${f.skinType} onChange=${set('skinType')} options=${[{ v: 'oily', l: '油皮' }, { v: 'combo', l: '混合' }, { v: 'dry', l: '干皮' }, { v: 'sensitive', l: '敏感' }]}/></div>
    <div class="stack-s"><span class="label">已经习惯用 A 醇或酸类了吗</span><${Seg} label="活性使用经验" value=${f.skinUsed} onChange=${set('skinUsed')} options=${[{ v: 'no', l: '没有' }, { v: 'yes', l: '用了 3 个月以上' }]}/></div>
    <div class="stack-s"><span class="label">想改善的问题</span><${Chips} value=${f.concerns} options=${CONCERN_OPTS} onToggle=${(v) => set('concerns')(toggleIn(f.concerns, v))}/></div>
    ${f.sex === 'f' ? html`<label class="check"><input id="p-cycle" type="checkbox" checked=${f.trackCycle} onChange=${(e) => set('trackCycle')(e.target.checked)}/><span>记录经期<br/><span class="small muted">用来解释体重波动和长痘规律</span></span></label>` : null}
  </div>`;
}
function SafetyFields({ f, set }) {
  return html`<div class="stack-s">${SAFETY_OPTS.map(([k, t]) => html`<label class="check"><input id=${'p-s-' + k} type="checkbox" checked=${!!f.safety[k]} onChange=${(e) => set('safety')({ ...f.safety, [k]: e.target.checked })}/><span>${t}</span></label>`)}<p class="small muted">选中后程序会取消热量缺口或隐藏相关内容。都没有就直接下一步。</p></div>`;
}

function readBasics(f) {
  const nowY = parseInt(E.today(), 10);
  const birthYear = parseInt(f.birthYear, 10), height = parseFloat(f.height), weight = parseFloat(f.weight);
  const goalWeight = String(f.goalWeight).trim() === '' ? null : parseFloat(f.goalWeight);
  if (!f.sex) return { err: '请选择生理性别，它决定代谢的计算公式。' };
  if (!(birthYear >= nowY - 100 && birthYear <= nowY - 10)) return { err: '请填写正确的出生年份，比如 1996。' };
  if (!(height >= 120 && height <= 220)) return { err: '身高请填 120 到 220 之间的数字。' };
  if (!(weight >= 30 && weight <= 250)) return { err: '体重请填 30 到 250 之间的数字。' };
  if (goalWeight != null && !(goalWeight >= 30 && goalWeight <= 250)) return { err: '目标体重请填 30 到 250 之间的数字，或者留空。' };
  return { birthYear, height, weight, goalWeight };
}
function planPreview(f) {
  const b = readBasics(f);
  if (b.err) return null;
  const nowY = parseInt(E.today(), 10);
  const safety = f.safety || {};
  return E.plan({ ...f, ...b, safety: nowY - b.birthYear < 18 ? { ...safety, under18: true } : safety }, b.weight, E.today());
}

function PlanPreview({ f }) {
  const pl = planPreview(f);
  if (!pl) return html`<div class="stack-s"><h3>你的计划</h3><p class="note">填完身高、体重和出生年份，这里会算出每天的目标。</p></div>`;
  return html`<div class="stack">
    <div class="row between"><h3>你的计划</h3><${Pill} s="info">${pl.modeName}<//></div>
    <div class="kv">
      ${pl.showNumbers ? html`<div><span class="v">${n0(pl.kcal)}<small>千卡</small></span><span class="k">每日热量</span></div><div><span class="v">${pl.protein}<small>g</small></span><span class="k">蛋白质</span></div>` : null}
      <div><span class="v">${n0(pl.water)}<small>ml</small></span><span class="k">饮水</span></div>
      <div><span class="v">${n0(pl.steps)}<small>步</small></span><span class="k">步数</span></div>
    </div>
    ${pl.showNumbers ? html`<p class="small muted tn">基础代谢约 ${n0(pl.bmr)} 千卡，日常消耗约 ${n0(pl.tdee)} 千卡。${pl.deficit ? `每天少吃约 ${n0(pl.deficit)} 千卡，预计每周减 ${pl.weekly.toFixed(2)} kg，这个速度比较容易保住肌肉和皮肤状态。` : ''}</p>` : null}
    ${pl.warnings.map((w) => html`<${Notice} s=${w.s}>${w.t}<//>`)}
  </div>`;
}

/* 从备份文件恢复。只在本地模式出现，账号里的记录不受影响。 */
function RestoreBackup({ intro }) {
  const file = useRef(null);
  const [r, setR] = useState(null);
  const [err, setErr] = useState('');
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = ''; // 同一个文件可以再选一次
    setErr(''); setR(null);
    if (!f) return;
    let text = '';
    try { if (f.size < 20e6) text = await f.text(); } catch (x) { /* 下面统一提示 */ }
    const got = text ? S.readBackup(text) : { err: '读不了这个文件，请选导出的 .json 备份文件。' };
    if (got.err) setErr(got.err); else setR(got);
  };
  const apply = () => {
    if (!S.restoreBackup(r)) { setErr('这个浏览器的存储空间不够，没有恢复成功，原来的记录没有变。'); return; }
    setR(null);
    S.closeSheet();
    S.toast('已从备份恢复');
  };
  const pick = html`<button type="button" class=${intro ? 'link' : 'btn ghost'} onClick=${() => file.current && file.current.click()}>${intro ? '从备份文件恢复' : '从备份恢复'}</button><input ref=${file} id=${intro ? 'restore-file-intro' : 'restore-file'} type="file" accept=".json,application/json" hidden onChange=${onFile}/>`;
  let found = null;
  if (r) {
    const c = r.counts, at = r.exportedAt ? new Date(r.exportedAt) : null;
    const when = at && !isNaN(at) ? `${at.getFullYear()}年${at.getMonth() + 1}月${at.getDate()}日` : '';
    found = html`<${Notice} title=${when ? `这是${when}导出的备份` : '找到备份'}>有 ${c.days} 天的每日记录${c.days ? `（${E.fmtShort(r.first)} 到 ${E.fmtShort(r.last)}）` : ''}${c.comp ? `、${c.comp} 次体测` : ''}${c.med ? `、${c.med} 条医美记录` : ''}。${intro ? '' : '恢复后，这个浏览器里现有的记录会被这份备份替换。'}${c.photos ? '对比照存在账号里，不会恢复。' : ''}<//>
      <div class="row">${intro ? html`<button type="button" class="btn" onClick=${apply}>恢复这份备份</button>` : html`<${Confirm} cls="btn" label="用这份备份替换现有记录" sure="确定替换？再点一次" onYes=${apply}/>`}<button type="button" class="link" onClick=${() => setR(null)}>取消</button></div>`;
  }
  return html`<div class="stack-s">
    ${intro ? html`<p class="small muted">在别的手机或浏览器用过气色簿？${pick}</p>` : html`<p class="small muted">换了手机或浏览器时，可以用导出的备份文件把记录搬过来。</p><div>${pick}</div>`}
    ${err ? html`<p class="err" role="alert">${err}</p>` : null}
    ${found}
  </div>`;
}

function Onboarding() {
  const [step, setStep] = useState(0);
  const [err, setErr] = useState('');
  const [f, setF] = useState({ nick: '', sex: '', birthYear: '', height: '', weight: '', goalWeight: '', activity: 'light', goals: ['lose', 'shape', 'posture', 'muscle'], trainDays: 3, level: 'new', venue: 'gym', skinType: 'combo', skinUsed: 'no', concerns: ['acne', 'tone', 'aging', 'puffy'], safety: {}, trackCycle: true });
  const set = (k) => (v) => setF((cur) => ({ ...cur, [k]: v }));
  const titles = ['先认识一下你', '能怎么练', '皮肤情况', '健康确认'];
  const next = () => {
    if (step === 0) { const b = readBasics(f); if (b.err) { setErr(b.err); return; } }
    setErr('');
    if (step < 3) { setStep(step + 1); window.scrollTo(0, 0); return; }
    const b = readBasics(f), today = E.today();
    const safety = today.slice(0, 4) - b.birthYear < 18 ? { ...f.safety, under18: true } : f.safety;
    S.setProfile({ ...f, ...b, safety, done: true, startDate: today, skinStart: today, foodMode: safety.ed ? 'palm' : 'numbers', medBudget: null });
    if (!safety.ed) S.patchDay(today, { weight: b.weight });
  };
  return html`<div class="setup">
    <div class="stack" style="gap:20px">
      <div class="stack-s"><div class="brand-big">气色簿</div><p class="note">把吃、动、睡、护肤和医美放进同一本账。每天做七件事，开一朵花。</p></div>
      ${step === 0 && S.state.mode === 'local' ? html`<${RestoreBackup} intro/>` : null}
      <div class="steps" aria-label=${`第 ${step + 1} 步，共 4 步`}>${titles.map((_, i) => html`<i class=${i <= step ? 'on' : ''}></i>`)}</div>
      <h1>${titles[step]}</h1>
      ${step === 0 ? html`<${BasicsFields} f=${f} set=${set}/>` : step === 1 ? html`<${TrainFields} f=${f} set=${set}/>` : step === 2 ? html`<${SkinFields} f=${f} set=${set}/>` : html`<${SafetyFields} f=${f} set=${set}/>`}
      ${err ? html`<p class="err">${err}</p>` : null}
      <div class="row">
        ${step > 0 ? html`<button type="button" class="btn ghost" onClick=${() => { setErr(''); setStep(step - 1); }}>上一步</button>` : null}
        <button type="button" class="btn" onClick=${next}>${step === 3 ? '生成我的计划' : '下一步'}</button>
      </div>
    </div>
    <aside class="aside stack">
      <${PlanPreview} f=${f}/>
      <div class="hero-day" style="grid-template-columns:auto minmax(0,1fr)">
        <${Flower} states=${[true, true, true, true, false, false, false]} size=${96}/>
        <p class="small muted">七瓣花对应每天七件事：睡够、喝水、吃好、动起来、体态、早护防晒、晚护。图上是做到四件的样子。</p>
      </div>
    </aside>
  </div>`;
}

function SettingsSheet() {
  const p = S.state.profile;
  const [f, setF] = useState(() => ({ ...p, birthYear: String(p.birthYear), height: String(p.height), weight: String(p.weight), goalWeight: p.goalWeight != null ? String(p.goalWeight) : '', medBudget: p.medBudget != null ? String(p.medBudget) : '', safety: p.safety || {} }));
  const [err, setErr] = useState('');
  const set = (k) => (v) => setF((cur) => ({ ...cur, [k]: v }));
  const save = () => {
    const b = readBasics(f);
    if (b.err) { setErr(b.err); return; }
    const budget = String(f.medBudget).trim() === '' ? null : Math.max(0, +f.medBudget || 0);
    const safety = parseInt(E.today(), 10) - b.birthYear < 18 ? { ...f.safety, under18: true } : f.safety;
    S.setProfile({ ...f, ...b, medBudget: budget, safety, foodMode: safety.ed ? 'palm' : f.foodMode });
    S.closeSheet();
    S.toast('设置已保存');
  };
  return html`<div class="stack">
    <${BasicsFields} f=${f} set=${set}/>
    <h3>训练</h3><${TrainFields} f=${f} set=${set}/>
    <h3>皮肤</h3><${SkinFields} f=${f} set=${set}/>
    <h3>健康情况</h3><${SafetyFields} f=${f} set=${set}/>
    <h3>饮食记录方式</h3>
    <${Seg} label="饮食记录方式" value=${f.foodMode} onChange=${set('foodMode')} options=${[{ v: 'numbers', l: '估算热量' }, { v: 'palm', l: '手掌法，不算数字' }]}/>
    <h3>医美预算</h3>
    <${Field} id="p-budget" label="每年预算（元，可不填）" inputmode="numeric" value=${f.medBudget} onInput=${set('medBudget')}/>
    ${err ? html`<p class="err">${err}</p>` : null}
    <div><button type="button" class="btn" onClick=${save}>保存设置</button></div>
    <h3>数据</h3>
    <p class="small muted">${S.state.mode === 'cloud' ? '记录保存在你的账号里，只有你本人能读到。把页面分享给别人时，对方看到的是一份空白的新记录。' : window.QS_OFFLINE ? '离线版的记录只存在这个浏览器里，换设备看不到。清理浏览器数据会把记录一起删掉，记得定期导出备份。' : '现在的打开方式只把记录存在这个浏览器里，换设备看不到。'}</p>
    <div class="row between">
      <button type="button" class="btn ghost" onClick=${() => S.exportAll()}>导出全部数据</button>
      <${Confirm} label="清空全部数据" sure="不可恢复，确定清空？再点一次" onYes=${async () => { S.closeSheet(); await S.clearAll(); }}/>
    </div>
    ${S.state.mode === 'local' ? html`<${RestoreBackup}/>` : null}
    <p class="small muted">气色簿提供的是一般健康信息，不能代替医生的诊断和治疗。</p>
  </div>`;
}

// ---------- 外壳 ----------
const TABS = [['today', '今日', Today], ['food', '饮食', Food], ['train', '训练', Train], ['body', '身材', Body], ['skin', '护肤', Skin], ['med', '医美', Med], ['review', '复盘', Review]];
function currentTab() {
  const h = location.hash.slice(1);
  if (h === 'train-posture') return 'train';
  return TABS.some((t) => t[0] === h) ? h : 'today';
}
function App() {
  const [, bump] = useState(0);
  const [tab, setTab] = useState(currentTab);
  useEffect(() => {
    const off = S.subscribe(() => bump((v) => v + 1));
    bump((v) => v + 1); // 订阅前已经发生的状态变化也要显示出来
    return off;
  }, []);
  useEffect(() => {
    const f = () => { setTab(currentTab()); window.scrollTo(0, 0); };
    addEventListener('hashchange', f);
    return () => removeEventListener('hashchange', f);
  }, []);
  useEffect(() => {
    const f = (e) => { if (e.key === 'Escape' && S.state.sheet) S.closeSheet(); };
    addEventListener('keydown', f);
    return () => removeEventListener('keydown', f);
  }, []);
  useEffect(() => {
    const f = () => { if (document.visibilityState === 'visible' && UI.followToday && UI.date !== E.today()) { UI.date = E.today(); S.emit(); } };
    document.addEventListener('visibilitychange', f);
    return () => document.removeEventListener('visibilitychange', f);
  }, []);
  const st = S.state;
  const toasts = html`<div class="toasts" aria-live="polite">${st.toasts.map((t) => html`<div key=${t.id} class=${'toast ' + (t.tone === 'crit' ? 'crit' : '')}>${t.msg}</div>`)}</div>`;
  if (!st.ready) {
    return html`<div class="boot"><div class="inner"><div class="brand" style="font-size:32px">气色簿</div>
      <p class="muted">${st.loadFailed ? '暂时连不上数据。请检查网络，然后重新打开这个页面。' : '正在打开你的记录，包括今日七件事、体重趋势和护肤方案。'}</p></div></div>${toasts}`;
  }
  if (!st.profile || !st.profile.done) return html`<${Onboarding}/>${toasts}`;
  const View = TABS.find((t) => t[0] === tab)[2];
  const settings = () => S.openSheet('设置', () => html`<${SettingsSheet}/>`);
  const links = () => TABS.map(([k, n]) => html`<a href=${'#' + k} aria-current=${tab === k ? 'page' : null}>${n}</a>`);
  return html`<div class="shell">
    <aside class="rail">
      <a class="brand" href="#today">气色簿</a>
      <nav aria-label="目录">${links()}</nav>
      <div class="rail-foot"><button type="button" class="btn ghost sm" onClick=${settings}>${Icon.sliders()}设置</button></div>
    </aside>
    <main class="main">
      <div class="topbar"><a class="brand" href="#today">气色簿</a><button type="button" class="icon-btn" aria-label="设置" onClick=${settings}>${Icon.sliders()}</button></div>
      ${st.mode === 'local' && !window.QS_OFFLINE ? html`<${Notice} s="warn">现在的打开方式只把记录存在这个浏览器里。在 claude.ai 登录后打开，手机和电脑才能同步。<//>` : null}
      ${st.stale ? html`<${Notice} s="warn">暂时连不上数据，看到的可能不是最新内容。<//>` : null}
      <${View} key=${tab}/>
    </main>
    <nav class="tabbar" aria-label="目录">${links()}</nav>
    ${st.sheet ? html`<div class="sheet-bg" onClick=${(e) => { if (e.target === e.currentTarget) S.closeSheet(); }}>
      <div class="sheet" role="dialog" aria-modal="true" aria-label=${st.sheet.title}>
        <div class="row between"><h2>${st.sheet.title}</h2><button type="button" class="icon-btn" aria-label="关闭" onClick=${() => S.closeSheet()}>${Icon.close()}</button></div>
        ${st.sheet.render()}
      </div>
    </div>` : null}
  </div>${toasts}`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App}/>`, root);
S.init();

</script>
<script>
// 注册离线缓存：第一次打开后，断网也能从手机里直接打开
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
// 已经有记录的人，请浏览器不要在空间紧张时自动清掉这些数据
try {
  if (localStorage.getItem('qisebu.v1.profile') && navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () {});
  }
} catch (e) { /* 存储不可用时页面自己会提示 */ }
</script></body></html>
